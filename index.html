// HOURS MATRIX SCREEN — Global Admin only
const HoursMatrixScreen=({user})=>{
  const {projects,tasks}=useCtx();
  const [meetings,setMeetingsRaw]=useState([]);
  const [filterMode,setFilterMode]=useState('week'); // 'week'|'month'
  const [weekOffset,setWeekOffset]=useState(0);
  const [monthOffset,setMonthOffset]=useState(0);

  useEffect(()=>{
    const unsub=dbOn('ncsflow/meetings',v=>{
      if(!v)return setMeetingsRaw([]);
      setMeetingsRaw(Array.isArray(v)?v:Object.values(v));
    });
    return unsub;
  },[]);

  // ── Date bounds ──
  const getBounds=()=>{
    if(filterMode==='week'){
      const now=new Date();
      const daysSinceFri=((now.getDay()-5)+7)%7;
      const fri=new Date(now);fri.setDate(now.getDate()-daysSinceFri+(weekOffset*7));fri.setHours(0,0,0,0);
      const thu=new Date(fri);thu.setDate(fri.getDate()+6);thu.setHours(23,59,59,999);
      return {start:fri,end:thu};
    } else {
      const now=new Date();
      const y=now.getFullYear();const mo=now.getMonth()+monthOffset;
      const start=new Date(y,mo,1);const end=new Date(y,mo+1,0,23,59,59,999);
      return {start,end};
    }
  };

  const {start:bStart,end:bEnd}=getBounds();

  const inBounds=(dateStr)=>{
    if(!dateStr)return false;
    try{const s=dateStr.split('T')[0];const[y,mo,d]=s.split('-').map(Number);const dt=new Date(y,mo-1,d);return dt>=bStart&&dt<=bEnd;}
    catch(e){return false;}
  };

  const fmtH=(mins)=>{
    if(!mins)return '—';
    const h=Math.floor(mins/60);const m=mins%60;
    return h>0?(m>0?h+'h '+m+'m':h+'h'):(m+'m');
  };

  const fmtBound=(d)=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

  // ── Active meetings in range ──
  const activeMeetings=meetings.filter(m=>m.status!=='canceled'&&inBounds(m.date));

  // ── All active projects ──
  const allProjects=[...projects].filter(p=>p.status==='active').sort((a,b)=>{const ao=a.sortOrder??999;const bo=b.sortOrder??999;return ao!==bo?ao-bo:a.code.localeCompare(b.code);});

  // ── Hours per project per dept ──
  const getMtgMins=(projId,deptId)=>{
    let mins=0;
    activeMeetings.filter(m=>m.projectId===projId&&(!m.department||m.department===deptId)).forEach(m=>{
      Object.values(m.attendance||{}).forEach(att=>{if(att)mins+=(att.actualHours||0)*60+(att.actualMinutes||0);});
    });
    return mins;
  };

  const getTaskMins=(projId,deptId)=>{
    let mins=0;
    tasks.filter(t=>t.projectId===projId&&t.status!=='deleted'&&(!t.department||t.department===deptId)).forEach(t=>{
      (t.timeLog||[]).forEach(e=>{if(inBounds(e.date||e.loggedAt))mins+=(e.hours||0)*60+(e.minutes||0);});
    });
    return mins;
  };

  // ── Only show depts that have at least 1 project ──
  const activeDepts=DEPARTMENTS.filter(d=>allProjects.some(p=>p.departments&&p.departments.includes(d.id)));

  const periodLabel=filterMode==='week'
    ?(weekOffset===0?'This Week':weekOffset===-1?'Last Week':weekOffset<0?Math.abs(weekOffset)+' weeks ago':weekOffset+' weeks ahead')
    :(monthOffset===0?'This Month':monthOffset===-1?'Last Month':monthOffset<0?Math.abs(monthOffset)+' months ago':monthOffset+' months ahead');

  // Export matrix to Excel/CSV
  const exportExcel=()=>{
    const toH=(mins)=>mins>0?parseFloat((mins/60).toFixed(2)):0; // decimal hours, 0 if empty
    const period=fmtBound(bStart)+' – '+fmtBound(bEnd);
    const headers=['Project',...activeDepts.map(d=>d.name),'TOTAL','Period'];
    const rows=[headers];
    allProjects.forEach(p=>{
      const cells=activeDepts.map(d=>toH(getMtgMins(p.id,d.id)+getTaskMins(p.id,d.id)));
      const total=toH(activeDepts.reduce((s,d)=>s+getMtgMins(p.id,d.id)+getTaskMins(p.id,d.id),0));
      rows.push([p.name+' ('+p.code+')',...cells,total,period]);
    });
    // Totals row
    const totals=activeDepts.map(d=>toH(allProjects.reduce((s,p)=>s+getMtgMins(p.id,d.id)+getTaskMins(p.id,d.id),0)));
    const grandTotal=toH(allProjects.reduce((s,p)=>s+activeDepts.reduce((ss,d)=>ss+getMtgMins(p.id,d.id)+getTaskMins(p.id,d.id),0),0));
    rows.push(['TOTAL',...totals,grandTotal,period]);
    const csv=rows.map(r=>r.join(',')).join('\n');
    const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='Hours_Matrix_'+periodLabel.replace(/ /g,'_')+'.csv';a.click();
  };

  return React.createElement('div',{className:'sc fi'},
    // Header
    React.createElement('div',{className:'sh'},
      React.createElement('div',null,
        React.createElement('div',{className:'st'},'📋 Hours Matrix'),
        React.createElement('div',{className:'ss'},'All projects × all departments — '+fmtBound(bStart)+' to '+fmtBound(bEnd))
      ),
      // Controls
      React.createElement('div',{style:{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}},
        // Week / Month toggle
        React.createElement('div',{style:{display:'flex',border:'1.5px solid var(--bdr)',borderRadius:8,overflow:'hidden'}},
          ['week','month'].map(m=>React.createElement('button',{key:m,onClick:()=>{setFilterMode(m);setWeekOffset(0);setMonthOffset(0);},style:{padding:'6px 14px',border:'none',cursor:'pointer',fontFamily:'var(--fb)',fontSize:12,fontWeight:600,background:filterMode===m?'var(--or)':'var(--surf)',color:filterMode===m?'#fff':'var(--t2)'}},m==='week'?'📅 Week':'🗓 Month'))
        ),
        // Navigator
        React.createElement('button',{onClick:()=>filterMode==='week'?setWeekOffset(v=>v-1):setMonthOffset(v=>v-1),style:{padding:'5px 11px',border:'1.5px solid var(--bdr)',borderRadius:7,background:'var(--surf)',cursor:'pointer',fontWeight:700,color:'var(--t2)'}},'‹'),
        React.createElement('span',{style:{fontSize:12,fontWeight:700,color:'var(--t1)',minWidth:110,textAlign:'center'}},periodLabel),
        React.createElement('button',{onClick:()=>filterMode==='week'?setWeekOffset(v=>v+1):setMonthOffset(v=>v+1),style:{padding:'5px 11px',border:'1.5px solid var(--bdr)',borderRadius:7,background:'var(--surf)',cursor:'pointer',fontWeight:700,color:'var(--t2)'}},'›'),
        (weekOffset!==0||monthOffset!==0)&&React.createElement('button',{onClick:()=>{setWeekOffset(0);setMonthOffset(0);},style:{padding:'5px 10px',border:'1.5px solid var(--or-bdr)',borderRadius:7,background:'var(--or-dim)',cursor:'pointer',fontWeight:700,color:'var(--or)',fontSize:11}},'Today'),
        React.createElement('button',{onClick:exportExcel,style:{display:'flex',alignItems:'center',gap:5,padding:'6px 13px',border:'1.5px solid #10b981',borderRadius:8,background:'#f0fdf4',color:'#059669',cursor:'pointer',fontWeight:700,fontSize:12,fontFamily:'var(--fb)'}},'⬇️ Export Excel')
      )
    ),

    // Matrix table
    React.createElement('div',{style:{overflowX:'auto'}},
      React.createElement('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:12,background:'var(--surf)',borderRadius:12,overflow:'hidden',border:'1px solid var(--bdr)'}},

        // Head
        React.createElement('thead',null,
          React.createElement('tr',null,
            React.createElement('th',{style:{padding:'10px 14px',textAlign:'left',background:'var(--card2)',borderBottom:'2px solid var(--bdr)',fontWeight:700,fontSize:11,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'.04em',minWidth:180,position:'sticky',left:0,zIndex:2}},'Project'),
            activeDepts.map(d=>React.createElement('th',{key:d.id,style:{padding:'10px 10px',textAlign:'center',background:'var(--card2)',borderBottom:'2px solid var(--bdr)',fontWeight:700,fontSize:11,color:d.color,minWidth:110,whiteSpace:'nowrap'}},d.icon+' '+d.name)),
            React.createElement('th',{style:{padding:'10px 10px',textAlign:'center',background:'var(--card2)',borderBottom:'2px solid var(--bdr)',fontWeight:800,fontSize:11,color:'var(--t1)',minWidth:100}},'TOTAL')
          )
        ),

        // Body
        React.createElement('tbody',null,
          allProjects.map((p,pi)=>{
            const rowMins=activeDepts.map(d=>getMtgMins(p.id,d.id)+getTaskMins(p.id,d.id));
            const totalMins=rowMins.reduce((s,v)=>s+v,0);
            const even=pi%2===0;
            return React.createElement('tr',{key:p.id,style:{background:even?'var(--surf)':'var(--card2)'}},
              // Project cell
              React.createElement('td',{style:{padding:'9px 14px',borderBottom:'1px solid var(--bdr)',position:'sticky',left:0,background:even?'var(--surf)':'var(--card2)',zIndex:1}},
                React.createElement('div',{style:{fontWeight:700,fontSize:12.5}},p.name),
                React.createElement('div',{style:{fontSize:10.5,color:'var(--t3)',marginTop:1}},p.code)
              ),
              // Dept cells
              activeDepts.map((d,di)=>{
                const mins=rowMins[di];
                const mtg=getMtgMins(p.id,d.id);
                const tsk=getTaskMins(p.id,d.id);
                return React.createElement('td',{key:d.id,style:{padding:'9px 10px',textAlign:'center',borderBottom:'1px solid var(--bdr)'}},
                  mins>0
                    ? React.createElement('div',null,
                        React.createElement('div',{style:{fontWeight:800,fontSize:13,fontFamily:'var(--fd)',color:d.color}},fmtH(mins)),
                        React.createElement('div',{style:{fontSize:9.5,color:'var(--t3)',marginTop:2}},
                          (mtg>0?'📅'+fmtH(mtg):'')+' '+(tsk>0?'✅'+fmtH(tsk):'')
                        )
                      )
                    : React.createElement('span',{style:{color:'var(--bdr)',fontSize:13}},'—')
                );
              }),
              // Total cell
              React.createElement('td',{style:{padding:'9px 10px',textAlign:'center',borderBottom:'1px solid var(--bdr)'}},
                totalMins>0
                  ? React.createElement('span',{style:{fontWeight:900,fontSize:13,fontFamily:'var(--fd)',color:'#f5a623'}},fmtH(totalMins))

          }),

          // Footer totals row
          React.createElement('tr',{style:{background:'var(--card2)',borderTop:'2px solid var(--bdr)'}},
            React.createElement('td',{style:{padding:'9px 14px',fontWeight:800,fontSize:12,color:'var(--t1)',position:'sticky',left:0,background:'var(--card2)',zIndex:1}},'TOTAL'),
            activeDepts.map(d=>{

const OverviewScreen=({user,setScreen,onOpenLCS,activeDept=''})=>{
  const {projects,tasks}=useCtx();

  // All visible projects
  const visProjects=[...getVisibleProjects(user,projects,activeDept)].sort((a,b)=>a.code.localeCompare(b.code));

  // For each project+dept combo, compute progress
  const getProjDeptRows=(p)=>{
    const depts=p.departments&&p.departments.length>0?p.departments:['—'];
    return depts.map(deptId=>{
      const dept=DEPARTMENTS.find(d=>d.id===deptId);
      const phs=getDeptPhases(p,deptId);
      const done=phs.filter(ph=>ph.status==='done').length;
      const total=LCS_PHASES.length;
      const pct=Math.round(done/total*100);
      // Find current phase
      const wip=phs.find(ph=>ph.status==='in_progress');
      const wipLCS=wip?LCS_PHASES.find(lp=>String(lp.id)===String(wip.phaseId)):null;
      const mainPhase=wipLCS?LCS_MAIN.find(mp=>mp.sub.includes(wipLCS.id)):null;
      const mainCols=['#6366f1','#f59e0b','#3b82f6','#ef4444','#10b981'];
      const mainCol=mainPhase?mainCols[LCS_MAIN.indexOf(mainPhase)]:'#94a3b8';
      // Days in current phase
      let daysInPhase=null;
      if(wip&&wip.completedAt===undefined){
        const sorted=[...LCS_PHASES].sort((a,b)=>a.id-b.id);
        const wipIdx=sorted.findIndex(lp=>String(lp.id)===String(wip.phaseId));
        if(wipIdx>0){
          const prev=phs.find(ph=>ph.phaseId===sorted[wipIdx-1].id);
          if(prev&&prev.completedAt)daysInPhase=Math.floor((new Date()-new Date(prev.completedAt))/86400000);
          else if(prev&&prev.completionDate)daysInPhase=Math.floor((new Date()-new Date(prev.completionDate))/86400000);
        }
      }
      const openTasks=tasks.filter(t=>t.projectId===p.id&&t.status!=='completed'&&t.department===deptId).length;
      const overdueTasks=tasks.filter(t=>t.projectId===p.id&&t.status!=='completed'&&t.department===deptId&&t.dueDate&&new Date(t.dueDate)<new Date(new Date().setHours(0,0,0,0))).length;
      return{deptId,dept,phs,done,total,pct,wipLCS,mainPhase,mainCol,daysInPhase,openTasks,overdueTasks};
    });
  };

  const STATUS_COL={active:'#10b981',on_hold:'#f59e0b',completed:'#6366f1',archived:'#94a3b8'};

  return React.createElement('div',{className:'sc fi'},

        {lbl:'On Hold',val:visProjects.filter(p=>p.status==='on_hold').length,col:'#f59e0b'},
        {lbl:'Dept Plans',val:visProjects.reduce((s,p)=>s+(p.departments&&p.departments.length>0?p.departments.length:1),0),col:'#3b82f6'},
      ].map(s=>React.createElement('div',{key:s.lbl,className:'scd'},
        React.createElement('div',{className:'sl'},s.lbl),
        React.createElement('div',{className:'sv',style:{color:s.col}},s.val),
        React.createElement('div',{style:{position:'absolute',bottom:0,left:0,right:0,height:3,background:s.col}})

            React.createElement('div',{style:{display:'flex',alignItems:'center',gap:10}},
              React.createElement('span',{className:'pco',style:{fontSize:11}},p.code),

                fontSize:11,fontWeight:700,padding:'2px 8px',borderRadius:5,
                background:statusCol+'18',color:statusCol,textTransform:'capitalize'
              }},p.status.replace('_',' '))

            React.createElement('div',{style:{fontFamily:'var(--fd)',fontSize:16,fontWeight:800,color:'var(--t1)',marginTop:3}},p.name),

// APP
// Sanitize: Firebase rejects undefined — convert all to null recursively
const sanitize=(obj)=>{
  if(obj===undefined)return null;
  if(obj===null||typeof obj!=='object')return obj;
  if(Array.isArray(obj))return obj.map(sanitize);
  const out={};
  Object.keys(obj).forEach(k=>{const v=sanitize(obj[k]);out[k]=v===undefined?null:v;});
  return out;
};

// ═══ WORKER3: RECURRING TASKS · TASK CHECKLIST · PERFORMANCE DASHBOARD (self-contained block) ═══
// Recurring templates live in ncsflow/recurring/<id>. Each template creates ONE task per period.
// A Firebase transaction on ncsflow/recurring/<id>/lastKey makes sure only one browser creates it,
// and the task id is fixed per period (rc_<tplId>_<periodKey>), so it can never be duplicated.
const REC_PATH='ncsflow/recurring';
const REC_FREQ={weekly:{l:'Every week',n:0},monthly:{l:'Every month',n:1},quarterly:{l:'Every quarter',n:3},yearly:{l:'Every year',n:12}};
const REC_WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const REC_MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const REC_MONTH_END=[
  'Post all pending vendor invoices (AP)','Post all pending customer invoices (AR)',
  'Bank reconciliation for every bank account','Post accruals and prepayment journals',
  'Run fixed asset depreciation proposal and post','Intercompany reconciliation',
  'Foreign currency revaluation (GL, AP, AR)','Sales tax settlement and posting',
  'Inventory close / recalculation','Review trial balance and financial reports',
  'Put AP/AR modules on hold in the ledger calendar for the closed period',
];
const ymd=d=>{const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());};
const recDayIn=(y,m,day)=>{const last=new Date(y,m+1,0).getDate();return new Date(y,m,day==='last'?last:Math.min(Number(day)||1,last));};
// Latest occurrence on or before `now`: {key,date,label} or null
const recOccurrence=(tpl,now=new Date(),ignoreStart=false)=>{
  if(!tpl)return null;
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const start=(!ignoreStart&&tpl.startDate)?new Date(tpl.startDate+'T00:00:00'):null;
  let occ=null;
  if(tpl.freq==='weekly'){
    const w=Number(tpl.weekday)||0;const d=new Date(today);d.setDate(d.getDate()-((d.getDay()-w+7)%7));
    occ={key:'W'+ymd(d),date:d,label:'week of '+d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})};
  }else{
    const step=(REC_FREQ[tpl.freq]||REC_FREQ.monthly).n;const sm=Number(tpl.startMonth)||0;
    for(let back=0;back<=24&&!occ;back++){
      const m0=new Date(today.getFullYear(),today.getMonth()-back,1);
      if(((m0.getMonth()-sm)%step+step)%step!==0)continue;
      const d=recDayIn(m0.getFullYear(),m0.getMonth(),tpl.day||1);
      if(d>today)continue;
      const lab=tpl.freq==='quarterly'?'Q'+(Math.floor(m0.getMonth()/3)+1)+' '+m0.getFullYear():tpl.freq==='yearly'?String(m0.getFullYear()):REC_MON[m0.getMonth()]+' '+m0.getFullYear();
      occ={key:'M'+m0.getFullYear()+'-'+String(m0.getMonth()+1).padStart(2,'0'),date:d,label:lab};
    }
  }
  if(occ&&start&&occ.date<start)return null;
  return occ;
};
// Next occurrence after today (for the screen)
const recNext=tpl=>{
  const t=new Date();
  for(let i=1;i<=400;i++){const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+i);const o=recOccurrence(tpl,d,true);
    if(o&&ymd(o.date)===ymd(d)&&(!tpl.startDate||ymd(d)>=tpl.startDate))return d;}
  return null;
};
const recSchedText=tpl=>{
  const f=REC_FREQ[tpl.freq]||REC_FREQ.monthly;
  if(tpl.freq==='weekly')return f.l+' on '+REC_WD[Number(tpl.weekday)||0];
  const day=tpl.day==='last'?'the last day':'day '+(tpl.day||1);
  const m=tpl.freq==='yearly'?' of '+REC_MON[Number(tpl.startMonth)||0]:tpl.freq==='quarterly'?' (from '+REC_MON[Number(tpl.startMonth)||0]+')':'';
  return f.l+' on '+day+m;
};
const recBuildTask=(tpl,occ)=>{
  const now=T();const due=new Date(occ.date);due.setDate(due.getDate()+(Number(tpl.dueDays)||0));
  return {id:'rc_'+tpl.id+'_'+occ.key,title:(tpl.title||'Recurring task')+' — '+occ.label,description:tpl.description||'',
    taskTypeId:tpl.taskTypeId||'',projectId:tpl.projectId,direction:'normal',status:'to_do',priority:Number(tpl.priority)||2,
    assignedTo:tpl.assignedTo||'',createdBy:tpl.createdBy||'',dueDate:ymd(due),createdAt:now,department:tpl.department||'',
    comments:[],attachments:[],dailyComments:{},recurringId:tpl.id,recurringKey:occ.key,
    checklist:(tpl.checklist||[]).filter(Boolean).map(text=>({id:uid(),text:String(text),done:false})),
    auditLog:[{id:uid(),performedBy:tpl.createdBy||'',action:'created',performedAt:now}]};
};
// Claim the period in Firebase, then add the task. Resolves true if this call created it.
// The claim is undone if the task does not reach the database (tasks not loaded yet, write denied, offline…),
// so the next run tries again instead of silently skipping that period.
const recClaimAndCreate=(tpl,occ,setTasks,tasksLoaded)=>new Promise(res=>{
  const path=REC_PATH+'/'+tpl.id+'/lastKey';
  const ref=db.ref(path);let prev=null;
  const release=()=>{
    if(typeof ref.transaction==='function')ref.transaction(cur=>cur===occ.key?prev:undefined,()=>{},false);
    else dbGet(path).then(cur=>{if(cur===occ.key)dbSet(path,prev);}).catch(()=>{});
  };
  const add=()=>{
    if(tasksLoaded&&!tasksLoaded()){release();return res(false);}
    const t=recBuildTask(tpl,occ);
    setTasks(p=>p.some(x=>x.id===t.id)?p:[t,...p]);
    // Confirm the task is really in ncsflow/tasks; otherwise give the period back
    setTimeout(()=>dbGet('ncsflow/tasks').then(v=>{
      const ok=Object.values(v||{}).some(x=>x&&x.id===t.id);
      if(!ok)release();res(ok);
    }).catch(()=>{release();res(false);}),4000);
  };
  if(typeof ref.transaction!=='function'){dbGet(path).then(cur=>{if(cur===occ.key)return res(false);prev=cur??null;return dbSet(path,occ.key).then(add);}).catch(()=>res(false));return;}
  ref.transaction(cur=>{if(cur===occ.key)return undefined;prev=cur??null;return occ.key;},(err,committed)=>{if(!err&&committed)add();else res(false);},false);
});
// Runs for managers while the app is open: as soon as tasks have really loaded, then every hour.
// loadedRef = App's loadedRef ({tasks:true} once the tasks listener has delivered data).
const useRecurringGenerator=(user,tasks,setTasks,dbReady,loadedRef)=>{
  const tasksRef=useRef(tasks);tasksRef.current=tasks;
  const setRef=useRef(setTasks);setRef.current=setTasks;
  useEffect(()=>{
    if(!dbReady||!user||!isManagerRole(user.role))return;
    let stop=false,busy=false,lastRun=0;
    const loaded=()=>!loadedRef||!!(loadedRef.current&&loadedRef.current.tasks);
    const run=()=>{
      if(stop||busy||!loaded())return;
      busy=true;lastRun=Date.now();
      dbGet(REC_PATH).then(v=>{
        if(stop)return;
        return Promise.all(Object.values(v||{}).map(tpl=>{
          if(!tpl||!tpl.id||tpl.active===false||!tpl.projectId)return null;
          const occ=recOccurrence(tpl);if(!occ||tpl.lastKey===occ.key)return null;
          if(tasksRef.current.some(t=>t.id==='rc_'+tpl.id+'_'+occ.key))return null;
          return recClaimAndCreate(tpl,occ,setRef.current,loaded);
        }));
      }).catch(()=>{}).then(()=>{busy=false;});
    };
    // Check every 2s until the first run has happened, then hourly
    const iv=setInterval(()=>{if(!lastRun||Date.now()-lastRun>=3600e3)run();},2000);
    return()=>{stop=true;clearInterval(iv);};
  },[dbReady,user&&user.id,user&&user.role]);
};

      checklist:f.checklistText.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,60),active:f.active!==false,

  };
  const edit=t=>setForm({...blank(),...t,day:String(t.day||1),weekday:String(t.weekday||0),startMonth:String(t.startMonth||0),priority:String(t.priority||2),dueDays:String(t.dueDays??5),checklistText:(t.checklist||[]).join('\n')});

const App=()=>{
  // Restore user from sessionStorage (survives tab duplicate & refresh)
  const [user,setUserRaw]=useState(()=>{
    // sessionStorage on purpose: closing the app fully asks for the password / fingerprint again (Bassem 2026-11-07)
    try{localStorage.removeItem('ncsflow_user');const s=sessionStorage.getItem('ncsflow_user');return s?JSON.parse(s):null;}catch{return null;}
  });
  const setUser=u=>{
    setUserRaw(u);
    try{if(u){const {password:_p,...safe}=u;sessionStorage.setItem('ncsflow_user',JSON.stringify(safe));}else sessionStorage.removeItem('ncsflow_user');}catch{}
  };
  const [screen,setScreen]=useState('dashboard');
  const [wisdom]=useState(()=>FF_WISDOM[Math.floor(Math.random()*FF_WISDOM.length)]);
  const [screenHistory,setScreenHistory]=useState([]);

  // Navigate with history tracking
  const goTo=(s)=>{
    setScreenHistory(prev=>[...prev,screen]);
    setScreen(s);
  };
  const goBack=()=>{
    if(screenHistory.length===0)return;
    const prev=screenHistory[screenHistory.length-1];
    setScreenHistory(h=>h.slice(0,-1));
    setScreen(prev);
  };
  const [selTask,setSelTask]=useState(null);
  const [projFilter,setProjFilter]=useState('');
  const [ovLCS,setOvLCS]=useState(null);
  const [activeDept,setActiveDept]=useState('');
  const [sbOpen,setSbOpen]=useState(false);
  // [SHOWAS] owner-only preview: '' = off, a user id, or '__role_<role>'
  const [previewId,setPreviewId]=useState('');
  const [pickerOpen,setPickerOpen]=useState(false);
  // ── Firebase realtime sync ──────────────────────────────────────────────────
  const [tasks,setTasksRaw]=useState([]);
  const [projects,setProjectsRaw]=useState([]);
  const [users,setUsersRaw]=useState([]);
  const [taskTypes,setTaskTypesRaw]=useState(TASK_TYPES_DEFAULT);
  const [dbReady,setDbReady]=useState(false);
  const [usersLoaded,setUsersLoaded]=useState(false);
  const [slowDb,setSlowDb]=useState(false);
  const dbReadyRef=useRef(false);
  // Which nodes Firebase has actually delivered. We never write a node we have not loaded,
  // so a slow connection can never overwrite the real data with an empty list.
  const loadedRef=useRef({tasks:false,projects:false,users:false,tasktypes:false});
  const [usersDenied,setUsersDenied]=useState(false);
  const [authUser,setAuthUser]=useState(undefined); // undefined = still checking
  useEffect(()=>auth.onAuthStateChanged(u=>setAuthUser(u||null)),[]);
  // If sign-in itself never answers (network / browser storage), still offer Retry after 8s (2026-11-07)
  useEffect(()=>{const t=setTimeout(()=>setSlowDb(true),8000);return()=>clearTimeout(t);},[]);
  const authKey=authUser===undefined?'?':(authUser?authUser.uid||authUser.email:'-');

  // Save helpers → write to Firebase ONLY after initial load
  const saveFB=(key,val)=>{if(dbReadyRef.current&&loadedRef.current[key])dbSet('ncsflow/'+key,val?sanitize(val):null).catch(e=>console.warn('Save blocked:',key,e&&e.code));};

  // Setters: update state + push to Firebase
  // [W2 fast-start] While the screen shows this device's cached copy, the app is view-only:
  // a change is refused (with a message) until Firebase has delivered that node, so cached data is never written back.

  // [W2 push] a task newly assigned to someone else → push to that person (sent by the Apps Script)
  const notifyAssign=(prev,next)=>{
    if(!user||prev===next||!Array.isArray(prev)||!Array.isArray(next))return;
    const pm=new Map(prev.filter(Boolean).map(t=>[t.id,t]));
    const ch=next.filter(t=>t&&t.assignedTo&&t.assignedTo!==user.id&&(!pm.has(t.id)||pm.get(t.id).assignedTo!==t.assignedTo));
    if(ch.length>20)return; // bulk import / restore: no push storm
    ch.forEach(t=>sendEmailNotif({event:'assign',taskId:t.id,taskTitle:t.title||'',department:t.department||'',assignedTo:t.assignedTo,isTicket:!!t.isTicket,isNew:!pm.has(t.id),actorId:user.id}));
  };
  const setTasks=v=>{if(!guard('tasks'))return;setTasksRaw(prev=>{const next=typeof v==='function'?v(prev):v;saveFB('tasks',next);if(loadedRef.current.tasks)notifyAssign(prev,next);return next;});};
  const setProjects=v=>{if(!guard('projects'))return;setProjectsRaw(prev=>{const next=typeof v==='function'?v(prev):v;saveFB('projects',next);return next;});};
  const setUsers=v=>{if(!guard('users'))return;setUsersRaw(prev=>{const next=typeof v==='function'?v(prev):v;saveFB('users',next);return next;});};
  const setTaskTypes=v=>{if(!guard('tasktypes'))return;setTaskTypesRaw(prev=>{const next=typeof v==='function'?v(prev):v;saveFB('tasktypes',next);return next;});};

      title='NCS Management';body='You have a new notification';
      const opts={body,icon:'icons/icon-192.png',tag:'ff-'+(taskId||'n'),data:{taskId:taskId||'',url:'./'}};
      if(navigator.serviceWorker&&navigator.serviceWorker.controller){navigator.serviceWorker.ready.then(r=>r.showNotification(title,opts)).catch(()=>{});return;}

    let firstTaskLoad=true;

      // Detect new tasks & new mentions after first load
      if(!firstTaskLoad){

          // New task assigned to me
          if(!prevTaskIds.has(t.id)&&t.assignedTo===user?.id){
            sendNotif('📋 New Task Assigned',t.title,t.id);
