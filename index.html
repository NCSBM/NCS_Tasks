<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6f9;--surf:#fff;--card:#fff;--card2:#f8f9fc;
  --bdr:#e2e8f0;--bdr2:#d0d7e3;
  --t1:#1a2236;--t2:#4a5568;--t3:#8a97ae;
  --or:#f5a623;--or-dim:#f5a62312;--or-bdr:#f5a62335;
  --dk:#2d3748;
  --em:#10b981;--am:#f59e0b;--rd:#ef4444;--bl:#3b82f6;
  --fd:'Syne',sans-serif;--fb:'DM Sans',sans-serif;--fm:'DM Mono',monospace;
}
body.dark{
  --bg:#0d1117;--surf:#161b22;--card:#161b22;--card2:#1c2333;
  --bdr:#30363d;--bdr2:#3d4451;
  --t1:#e6edf3;--t2:#8b949e;--t3:#484f58;
  --dk:#010409;
}
body.dark .tb{box-shadow:0 1px 0 var(--bdr)}
body.dark .cd,.dark .scd,.dark .pc,.dark .ttc,.dark .lc,.dark .mod{box-shadow:none}
body.dark .tr:hover{border-color:#f5a623!important;background:#1c2333!important}
body.dark .ip:focus{border-color:#f5a623;box-shadow:0 0 0 3px #f5a62325}
body.dark .bn.bpr{background:#f5a623;color:#0d1117}
body.dark .bn.bpr:hover{background:#e8941a}
body.dark select option{background:#161b22;color:#e6edf3}
body.dark .ni.ac{color:#f5a623;background:#f5a62318;border-left:3px solid #f5a623}
body.dark .fs{background:#1c2333;border-color:#30363d;color:#e6edf3}
body.dark .fs:focus{border-color:#f5a623}
body.dark .tb{border-bottom:1px solid #30363d}
body.dark .pt.at{border-color:#f5a623;color:#f5a623}
body.dark .stb.ast{background:#f5a62318}
body,*{transition:background-color .2s,border-color .2s,color .15s}
html,body,#root{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--t1);font-family:var(--fb);font-size:14px;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#cbd5e0;border-radius:3px}
select option{background:var(--surf);color:var(--t1)}
button{font-family:var(--fb);cursor:pointer;border:none;background:none}
input,select,textarea{font-family:var(--fb);border:none;outline:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.fi{animation:fadeIn .25s ease forwards}
.si{animation:slideIn .3s ease forwards}
.sp{animation:spin 1s linear infinite;width:15px;height:15px;border:2.5px solid #f5a62335;border-top-color:var(--or);border-radius:50%;display:inline-block}
/* LAYOUT */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:236px;min-width:236px;background:var(--dk);display:flex;flex-direction:column;height:100vh}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0}
/* SIDEBAR */
.logo-a{padding:18px 16px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;gap:11px}
.logo-t{font-family:var(--fd);font-size:15px;font-weight:700;color:#fff;line-height:1.2}
.logo-s{font-size:10.5px;color:#f5a62399;margin-top:1px}
nav.snav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.ni{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:10px;font-size:13.5px;font-weight:500;color:#94a3b8;transition:all .15s;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.ni:hover{color:#fff;background:#ffffff12}
.ni.ac{color:var(--or);background:#f5a62318;border-left:3px solid var(--or);padding-left:10px}
.sf{padding:12px 10px;border-top:1px solid #ffffff10}
.uc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:#ffffff0a;margin-bottom:6px}
.un{font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ur{font-size:10.5px;color:var(--or);margin-top:1px;font-weight:600}
.lb{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;font-size:13px;color:#64748b;transition:all .15s;cursor:pointer;border:none;background:none;width:100%}
.lb:hover{color:#ef4444;background:#ef444410}
/* TOPBAR */
.tb{height:56px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--surf);flex-shrink:0;box-shadow:0 1px 3px #0000000a}
.ap{display:flex;align-items:center;gap:6px;font-size:12px;color:#dc2626;background:#fef2f2;border:1px solid #fecaca;padding:5px 12px;border-radius:20px;font-weight:600}
.dl{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--dk)}
.ds{font-size:10.5px;color:var(--t3);text-align:right}
.tu{display:flex;align-items:center;gap:9px;padding:6px 12px;border-radius:10px;border:1px solid var(--bdr);background:var(--bg)}
/* AVATAR */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;font-family:var(--fd)}
.avs{width:28px;height:28px;font-size:10px}
.avm{width:36px;height:36px;font-size:13px}
.avl{width:44px;height:44px;font-size:15px}
.a0{background:#f5a623}.a1{background:#6366f1}.a2{background:#10b981}.a3{background:#3b82f6}.a4{background:#8b5cf6}.a5{background:#ec4899}
/* BUTTONS */
.bn{display:inline-flex;align-items:center;gap:7px;font-weight:600;border:none;cursor:pointer;transition:all .15s;border-radius:9px;white-space:nowrap}
.bsm{padding:6px 13px;font-size:12.5px}
.bmd{padding:9px 18px;font-size:13.5px}
.blg{padding:12px 24px;font-size:14px;width:100%;justify-content:center}
.bpr{background:var(--or);color:#fff}.bpr:hover{background:#e8941a}
.bse{background:#fff;color:var(--t2);border:1px solid var(--bdr)}.bse:hover{background:var(--bg)}
.bda{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}.bda:hover{background:#fee2e2}
.bgh{color:var(--t3);background:none;padding:6px 10px}.bgh:hover{color:var(--t1);background:var(--bg)}
.bin{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe}.bin:hover{background:#dbeafe}
.bn:disabled{opacity:.4;cursor:not-allowed}
/* FORM */
.fl{display:flex;flex-direction:column;gap:6px}
.fl label{font-size:11.5px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;display:block}
.ip{background:var(--surf);border:1.5px solid var(--bdr);color:var(--t1);border-radius:9px;padding:10px 14px;font-size:13.5px;font-family:var(--fb);transition:border-color .15s;width:100%;display:block}
.ip:focus{border-color:var(--or);box-shadow:0 0 0 3px var(--or-dim);outline:none}
.ip::placeholder{color:var(--t3)}
/* CARDS */
.cd{background:var(--surf);border:1.5px solid var(--bdr);border-radius:16px;box-shadow:0 1px 4px #0000000a}
/* BADGES */
.bg{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:600;border:1px solid transparent}
.dov{background:#fef2f2;color:#dc2626;border-color:#fecaca}
.dtd{background:#fffbeb;color:#d97706;border-color:#fde68a}
.dsn{background:#fefce8;color:#a16207;border-color:#fef08a}
.ddn{background:#f0fdf4;color:#059669;border-color:#bbf7d0}
.dok{background:var(--bg);color:var(--t3);border-color:var(--bdr)}
/* SCREEN */
.sc{flex:1;overflow-y:auto;padding:32px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;padding-bottom:4px}
.st{font-family:var(--fd);font-size:24px;font-weight:800;color:var(--t1);line-height:1.3;}
.ss{font-size:13px;color:var(--t3);margin-top:3px}
/* STATS */
.sgr{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px}
.scd{background:var(--surf);border:1.5px solid var(--bdr);border-radius:16px;padding:22px;position:relative;overflow:hidden;box-shadow:0 1px 4px #0000000a}
.sv{font-family:var(--fd);font-size:36px;font-weight:800;line-height:1;margin:6px 0 4px}
.sl{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
/* ALERTS */
.alr{display:flex;align-items:center;gap:10px;border-radius:12px;padding:11px 16px;font-size:13px;margin-bottom:8px;font-weight:500}
.alov{background:#fef2f2;border:1.5px solid #fecaca;color:#dc2626}
.altd{background:#fffbeb;border:1.5px solid #fde68a;color:#d97706}
/* DAILY PROMPT */
.dp{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:2px solid #f59e0b;border-radius:14px;padding:16px 18px;margin-bottom:20px}
.dp-title{font-family:var(--fd);font-size:14px;font-weight:800;color:#92400e;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.dp-sub{font-size:12.5px;color:#a16207;margin-bottom:12px}
/* TASK LIST */
.tgr{margin-bottom:24px}
.tgh{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:1.5px solid var(--bdr)}
.tgtl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tgct{font-size:11px;color:var(--t3);background:var(--bg);padding:2px 9px;border-radius:20px;border:1px solid var(--bdr)}
.tr{display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--surf);border:1.5px solid var(--bdr);border-radius:12px;cursor:pointer;transition:all .15s;margin-bottom:6px;box-shadow:0 1px 3px #0000000a}
.tr:hover{border-color:var(--or);box-shadow:0 2px 8px #f5a62318}
.tr.sel{border-color:var(--or);background:#fff7ed}
.ttl{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
.tmt{display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap}
.tmi{font-size:11.5px;color:var(--t3)}
.trg{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-left:auto}
/* FILTER BAR */
.fb{display:flex;align-items:center;gap:10px;padding:13px 20px;border-bottom:1px solid var(--bdr);background:var(--surf);flex-wrap:wrap}
.fs{background:var(--surf);border:1.5px solid var(--bdr);color:var(--t2);border-radius:8px;padding:7px 12px;font-size:12.5px;font-family:var(--fb);transition:border-color .15s;cursor:pointer}
.fs:focus{border-color:var(--or);outline:none}
.isi{position:relative}.isi input{padding-left:34px}.isi .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none}
/* PANEL */
.pov{position:fixed;inset:0;z-index:100;display:flex}
.pbk{flex:1;background:#00000038;backdrop-filter:blur(3px)}
.pan{width:700px;max-width:96vw;background:var(--surf);border-left:2px solid var(--bdr);height:100vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:-8px 0 32px #00000015}
.phd{padding:22px 24px;border-bottom:1px solid var(--bdr);display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.psb{padding:12px 24px;border-bottom:1px solid var(--bdr);background:var(--bg);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stb{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;font-size:11.5px;font-weight:600;cursor:pointer;transition:all .15s;background:#fff;border:1.5px solid var(--bdr);color:var(--t3)}
.stb.ast{border-color:currentColor}
.stb.aw:hover{border-color:var(--or);color:var(--or)}
.stb.dis{opacity:.3;cursor:not-allowed}
.ssep{width:16px;height:1.5px;background:var(--bdr);flex-shrink:0}
.ptb{display:flex;border-bottom:1px solid var(--bdr);padding:0 24px}
.pt{padding:12px 16px;font-size:13px;font-weight:600;border-bottom:2.5px solid transparent;color:var(--t3);cursor:pointer;transition:all .15s}
.pt.at{border-color:var(--or);color:var(--or)}
.pt:hover{color:var(--t1)}
.pb{flex:1;overflow-y:auto;padding:24px}
.tcn{display:inline-flex;background:var(--bg);color:var(--t3);font-size:10px;padding:1px 7px;border-radius:20px;margin-left:6px;border:1px solid var(--bdr)}
/* DETAIL */
.dgr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dfl{background:var(--bg);border:1px solid var(--bdr);border-radius:10px;padding:13px 15px}
.dfl label{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px}
/* DIRECTION BADGE */
.dir-ms{background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.dir-em{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.dir-no{background:var(--bg);color:var(--t3);border:1px solid var(--bdr);padding:5px 12px;border-radius:8px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
/* ATTACHMENTS */
.ati{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg);border:1.5px solid var(--bdr);border-radius:10px;margin-bottom:8px}
.aic{width:36px;height:36px;background:var(--or-dim);border:1px solid var(--or-bdr);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--or)}
.uz{border:2px dashed var(--bdr2);border-radius:14px;padding:32px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:16px}
.uz:hover{border-color:var(--or);background:var(--or-dim)}
/* AUDIT */
.aui{display:flex;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--bdr);margin-bottom:14px}
.aui:last-child{border:none;margin:0;padding:0}
/* PROJECTS */
.pgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px;max-width:100%} /* [FT] pagination used to share this class */
.pc{background:var(--surf);border:1.5px solid var(--bdr);border-radius:18px;padding:22px 28px;transition:all .2s;box-shadow:0 1px 4px #0000000a}
.pc:hover{border-color:var(--or);box-shadow:0 4px 16px #f5a62318;transform:translateY(-1px)}
.pco{font-family:var(--fm);font-size:11px;color:var(--or);background:var(--or-dim);padding:3px 9px;border-radius:5px;display:inline-block;border:1px solid var(--or-bdr)}
.pnm{font-family:var(--fd);font-size:16px;font-weight:700;margin-top:8px;margin-bottom:3px;line-height:1.3}
.prb{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin:8px 0 5px}
.prf{height:100%;background:var(--or);border-radius:3px;transition:width .6s}
.avst{display:flex}.avst .av{margin-left:-8px;border:2px solid #fff}.avst .av:first-child{margin-left:0}
/* LCS */
.lph{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.phc{border:1.5px solid var(--bdr);border-radius:11px;padding:11px 12px;background:var(--surf);transition:border-color .15s}
.phc:hover{border-color:var(--or)}
.phc.dph{background:#f0fdf4;border-color:#bbf7d0}
.phc.iph{background:#fffbeb;border-color:#fde68a}
.phn{font-family:var(--fm);font-size:10px;font-weight:700;color:var(--t3);margin-bottom:3px}
.phnm{font-size:12px;font-weight:600;line-height:1.3;margin-bottom:6px}
.phi{border:1px solid var(--bdr);border-radius:6px;padding:4px 8px;font-size:11px;font-family:var(--fm);color:var(--t2);background:#fff;cursor:pointer;width:100%;margin-top:3px;transition:border-color .15s;font-family:var(--fb)}
.phi:focus{border-color:var(--or);outline:none}
/* USERS */
.utb{width:100%;border-collapse:collapse}
.utb th{text-align:left;padding:11px 16px;font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1.5px solid var(--bdr);background:var(--bg)}
.utb td{padding:12px 16px;border-bottom:1px solid var(--bdr);vertical-align:middle}
.utb tr:last-child td{border:none}
.utb tr:hover td{background:var(--bg)}
/* TASK TYPES */
.ttgr{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ttc{background:var(--surf);border:1.5px solid var(--bdr);border-radius:14px;padding:20px;transition:all .15s;box-shadow:0 1px 3px #0000000a}
.ttc:hover{border-color:var(--or)}
.ttc.inac{opacity:.5}
/* MODAL */
.mov{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:#00000055;backdrop-filter:blur(5px)}
.mod{background:var(--surf);border:1.5px solid var(--bdr);border-radius:20px;width:100%;max-width:560px;max-height:92vh;overflow:hidden;box-shadow:0 20px 60px #00000025;display:flex;flex-direction:column}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.mtl{font-family:var(--fd);font-size:17px;font-weight:800}
.mbd{padding:24px;overflow-y:auto;flex:1}
.fgr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.frw{margin-bottom:14px}
.ibx{background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:10px 13px;display:flex;align-items:flex-start;gap:8px;font-size:12px;color:#92400e}
/* LOGIN */
.lbg{min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lc{background:var(--surf);border:1.5px solid var(--bdr);border-radius:24px;padding:40px;width:100%;max-width:440px;box-shadow:0 4px 24px #0000000f}
.llg{text-align:center;margin-bottom:28px}
.liw{display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.lti{font-family:var(--fd);font-size:22px;font-weight:800}
.lsu{font-size:13px;color:var(--t3);margin-top:4px}
.dgd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.dbt{background:var(--bg);border:1.5px solid var(--bdr);border-radius:9px;padding:10px 13px;text-align:left;cursor:pointer;transition:all .15s;font-family:var(--fb)}
.dbt:hover{border-color:var(--or);background:var(--or-dim)}
.dlb{font-size:10px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:2px}
.dun{font-family:var(--fm);font-size:12.5px;font-weight:500}
.eb{background:#fef2f2;border:1.5px solid #fecaca;border-radius:9px;padding:10px 13px;display:flex;align-items:center;gap:8px;color:#dc2626;font-size:13px;font-weight:500;margin-bottom:14px}
.pw{position:relative}
.pt2{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--t3);cursor:pointer;background:none;border:none;display:flex}
.pt2:hover{color:var(--t2)}
.dv{height:1.5px;background:var(--bdr);margin:20px 0}
/* 2-col */
.d2c{display:grid;grid-template-columns:1fr 310px;gap:20px}
/* DAILY COMMENT MODAL */
.dc-banner{background:linear-gradient(135deg,#fff7ed,#fef3c7);border:2px solid var(--or);border-radius:14px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:flex-start;gap:14px}
.dc-icon{font-size:28px;flex-shrink:0}
.direction-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.dp-opt{border:2px solid var(--bdr);border-radius:12px;padding:12px;text-align:center;cursor:pointer;transition:all .15s;background:#fff}
.dp-opt:hover{border-color:var(--or);background:var(--or-dim)}
.dp-opt.sel-d{border-color:var(--or);background:var(--or-dim)}
.dp-opt .dp-ico{font-size:24px;margin-bottom:6px}
.dp-opt .dp-lbl{font-size:12px;font-weight:700;color:var(--t1)}
.dp-opt .dp-sub{font-size:10.5px;color:var(--t3);margin-top:2px}
@media(max-width:1100px){.d2c{grid-template-columns:1fr}}
@media(max-width:768px){
  .sidebar{position:fixed;z-index:201;transform:translateX(-100%);transition:transform .3s}
  .sidebar.op{transform:translateX(0)}
  .sgr{grid-template-columns:1fr 1fr}
  .pgr{grid-template-columns:1fr}
  .ttgr{grid-template-columns:1fr 1fr}
  .fgr{grid-template-columns:1fr}
  .pan{width:100vw}
  .sc{padding:16px}
  .ttl{max-width:180px}
  .lph{grid-template-columns:1fr}
  .direction-pick{grid-template-columns:1fr}
}
/* ═══════════════════════════════════════════════════════════════════════════
   FINANCEFLOW "MIDNIGHT GOLD" v2 — top navigation shell, starfield, glass cards
   Layered on top of the base styles above; remove this block to roll back.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --fd:'Plus Jakarta Sans','Inter',sans-serif;--fb:'Inter','Segoe UI',sans-serif;--fm:'JetBrains Mono','DM Mono',monospace;
  --gold:#d8b25a;--gold2:#f4dc98;--gold3:#c99a2e;--gold-soft:rgba(216,178,90,.14);
  --acc:#2563eb;--acc2:#1d4fc4;--acc-soft:rgba(37,99,235,.09);
  --or:#c99a2e;--or-dim:rgba(201,154,46,.10);--or-bdr:rgba(201,154,46,.35);
  --bg:#eef2f8;--bg2:#e6ebf4;--surf:#fff;--card:#fff;--card2:#f9fbfe;
  --bdr:#dde4ef;--bdr2:#cfd8e6;--line2:#e8edf5;
  --t1:#0c1730;--t2:#43526d;--t3:#7a88a0;--dk:#0c1730;
  --glass:rgba(255,255,255,.82);
  --sh1:0 1px 2px rgba(15,30,60,.04),0 10px 30px rgba(15,30,60,.06);
  --sh2:0 18px 44px rgba(15,30,60,.12);
  --r:18px;--ease:cubic-bezier(.2,.8,.2,1);
}
body.dark{
  --acc:#5b97f7;--acc2:#3b74d8;--acc-soft:rgba(91,151,247,.14);
  --or:#d8b25a;--or-dim:rgba(216,178,90,.12);--or-bdr:rgba(216,178,90,.4);
  --bg:#060b17;--bg2:#0a1222;--surf:#0e1830;--card:#0e1830;--card2:#122040;
  --bdr:#1d2d4d;--bdr2:#26385e;--line2:#16243f;
  --t1:#eef3fb;--t2:#aab8cf;--t3:#6f82a2;--dk:#060b17;
  --glass:rgba(8,14,28,.84);
  --sh1:0 10px 30px rgba(0,0,0,.28);
  --sh2:0 24px 60px rgba(0,0,0,.45);
}
html,body{background:var(--bg)}
#root{background:transparent}
body{font-family:var(--fb);font-feature-settings:"cv11","ss01";letter-spacing:-.005em}
body,*{transition:none}
button,a,.tr,.pc,.cd,.scd,.ttc,.bn,.ip,.fs,.stb,.pt,.phc,.dbt,.uz,.dp-opt,.ffh-tab,.ffh-seg button,.ffh-ib{transition:background-color .2s,border-color .2s,color .15s,box-shadow .25s var(--ease),transform .25s var(--ease)}

/* ── keyframes ── */
@keyframes ffRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes ffFade{from{opacity:0}to{opacity:1}}
@keyframes ffPop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes ffSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes ffDrop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes ffShimmer{from{transform:translateX(-100%)}to{transform:translateX(240%)}}
@keyframes ffShine{from{left:-60%}to{left:130%}}
@keyframes ffPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,114,114,.4)}60%{box-shadow:0 0 0 7px rgba(244,114,114,0)}}
@keyframes ffWave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
@keyframes ffGrad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes ffFab{0%{box-shadow:0 10px 30px rgba(216,178,90,.45),0 0 0 0 rgba(216,178,90,.45)}70%{box-shadow:0 10px 30px rgba(216,178,90,.45),0 0 0 14px rgba(216,178,90,0)}100%{box-shadow:0 10px 30px rgba(216,178,90,.45),0 0 0 0 rgba(216,178,90,0)}}

/* ── animated starfield + glow (canvas injected by script) ── */
#ff-fx{position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%}
.ff-glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(1000px 560px at 100% -10%,rgba(91,151,247,.14),transparent 60%),radial-gradient(800px 480px at -10% 110%,rgba(216,178,90,.10),transparent 60%)}
body:not(.dark) .ff-glow{opacity:.6}
body:not(.dark) #ff-fx{opacity:.45}
#root{position:relative;z-index:1}

/* ── shell: header on top, content below ── */
.app{flex-direction:column;height:100vh;height:100dvh;position:relative;z-index:1;background:transparent}
.main{background:transparent;flex:1;min-height:0}
.main>.tb{display:none}
.sc{background:transparent;padding:26px max(28px,calc((100% - 1240px)/2))}

.ffh{position:sticky;top:0;z-index:30;background:var(--glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line2);flex-shrink:0;padding-top:env(safe-area-inset-top)}
.ffh-row{max-width:1296px;margin:0 auto;padding:10px 28px;display:flex;align-items:center;gap:12px}
.ffh-brand{display:flex;align-items:center;gap:11px;margin-inline-end:auto;min-width:0;cursor:pointer;background:none;border:0;text-align:left;color:inherit}
.ffh-mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#fff;border:1px solid var(--bdr);box-shadow:0 6px 20px -6px rgba(216,178,90,.5);overflow:hidden;flex-shrink:0}
body.dark .ffh-mark{border-color:rgba(216,178,90,.45)}
.ffh-mark img{width:34px;height:34px;object-fit:contain}
.ffh-brand b{display:flex;align-items:center;gap:7px;font-family:var(--fd);font-size:16px;font-weight:800;color:var(--t1);white-space:nowrap}
.ffh-brand b i{font-style:normal;font-family:var(--fb);font-size:10px;letter-spacing:1.5px;color:var(--gold3);border:1px solid var(--gold3);border-radius:6px;padding:1px 5px;font-weight:700}
body.dark .ffh-brand b i{color:var(--gold);border-color:var(--gold)}
.ffh-brand span{display:block;color:var(--t3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ffh-seg{display:inline-flex;background:var(--bg2);border:1px solid var(--bdr);border-radius:13px;padding:3px;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:none;flex-shrink:1;min-width:0}
.ffh-seg::-webkit-scrollbar{display:none}
.ffh-seg button{padding:6px 12px;border-radius:10px;font-size:12.5px;color:var(--t2);font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px;border:0;background:none;cursor:pointer;font-family:var(--fb)}
.ffh-seg button:hover{color:var(--t1);background:rgba(127,140,170,.10)}
.ffh-seg button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 4px 14px rgba(59,116,216,.38)}
.ffh-tools{display:flex;align-items:center;gap:8px;min-width:0}
/* Topbar re-used inside the header as a compact tool strip */
.ffh-tools .tb{height:auto;padding:0;border:0!important;background:none!important;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;min-width:0}
.ffh-tools .tb>button:first-child{display:none!important}
.ffh-tools .tb>div[style*="flex: 1"]{display:none}
.ffh-tools .tb>div:last-child{gap:8px!important}
.ffh-tools .tb>div:last-child>div[style*="width: 1px"],.ffh-tools .tb .tu,.ffh-tools .tb .dl,.ffh-tools .tb .ds{display:none}
.ffh-tools .tb>div:last-child>div[style*="text-align: right"]{display:none}
.ffh-tools .tb button[style*="width: 34px"],.ffh-tools .tb>div:last-child>div>button{width:36px!important;height:36px!important;border-radius:11px!important;border:1px solid var(--bdr)!important;background:var(--bg2)!important}
.ffh-tools .tb button[style*="width: 34px"]:hover,.ffh-tools .tb>div:last-child>div>button:hover{border-color:var(--acc)!important;transform:translateY(-1px)}
.ffh-tools .tb .ap,.ffh-tools .tb>div:last-child>div[title]{border-radius:999px!important;height:32px;padding:0 12px!important;display:flex;align-items:center}
.ffh-tools .tb>button[title="Go back"]{border-radius:11px!important;height:36px;background:var(--bg2)!important;border:1px solid var(--bdr)!important}
.ffh-ib{height:36px;min-width:36px;padding:0 11px;border-radius:11px;border:1px solid var(--bdr);color:var(--t2);font-size:13px;display:inline-flex;gap:6px;align-items:center;justify-content:center;background:var(--bg2);white-space:nowrap;cursor:pointer;font-family:var(--fb);font-weight:600}
.ffh-ib:hover{color:var(--t1);border-color:var(--acc)}
.ffh-user{position:relative}
.ffh-user>.ffh-ib{padding:0 10px 0 4px;height:40px;border-radius:999px}
.ffh-user .un2{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.ffh-user .un2 b{font-size:12.5px;color:var(--t1)}.ffh-user .un2 small{font-size:10.5px;color:var(--gold3);font-weight:600}
body.dark .ffh-user .un2 small{color:var(--gold)}
.ffh-menu{position:fixed;z-index:400;min-width:220px;background:var(--surf);border:1px solid var(--bdr);border-radius:16px;padding:6px;box-shadow:var(--sh2);animation:ffDrop .18s var(--ease) both}
body.dark .ffh-menu{background:linear-gradient(180deg,var(--card2),var(--card))}
.ffh-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:11px;border:0;background:none;color:var(--t2);font-size:13px;font-weight:600;cursor:pointer;text-align:left;font-family:var(--fb)}
.ffh-menu button:hover{background:var(--acc-soft);color:var(--t1)}
.ffh-menu button.on{color:var(--gold3);background:var(--gold-soft)}
body.dark .ffh-menu button.on{color:var(--gold2)}
.ffh-menu button.danger{color:#ef4444}.ffh-menu button.danger:hover{background:rgba(239,68,68,.1)}
.ffh-menu hr{border:0;height:1px;background:var(--bdr);margin:6px 4px}
.ffh-menu .mh{padding:8px 12px 4px;font-size:10.5px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.08em}
.ffh-tabs{max-width:1296px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.ffh-tabs::-webkit-scrollbar{display:none}
.ffh-tab{padding:10px 13px 12px;color:var(--t3);font-weight:600;font-size:13.5px;border:0;border-bottom:2px solid transparent;background:none;white-space:nowrap;display:flex;gap:7px;align-items:center;cursor:pointer;font-family:var(--fb);position:relative}
.ffh-tab .e{font-size:15px;filter:saturate(1.1)}
.ffh-tab:hover{color:var(--t1)}
.ffh-tab.on{color:var(--t1);border-bottom-color:var(--gold)}
.ffh-tab.on::after{content:"";position:absolute;left:18%;right:18%;bottom:-2px;height:10px;background:radial-gradient(closest-side,rgba(216,178,90,.55),transparent);filter:blur(4px);pointer-events:none}
.ffh-tab .cnt{min-width:18px;height:18px;border-radius:9px;background:#ef4444;color:#fff;font-size:10.5px;font-weight:800;display:inline-grid;place-items:center;padding:0 5px}
.ffh-tab .car{font-size:10px;opacity:.6}

/* ── floating action buttons ── */
.ff-fab{position:fixed;left:26px;bottom:calc(26px + env(safe-area-inset-bottom));z-index:40;width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 30% 30%,var(--gold2),var(--gold) 60%,#8a6010);color:#1a1200;font-size:30px;font-weight:300;display:grid;place-items:center;font-family:var(--fb);animation:ffFab 2.8s ease-out infinite}
.ff-fab:hover{transform:scale(1.08) rotate(90deg)}
.ff-fab-mini{position:fixed;left:32px;z-index:40;width:48px;height:48px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font-size:20px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--or-bdr);box-shadow:var(--sh1)}
.ff-fab-mini:hover{transform:translateY(-2px);border-color:var(--gold)}

/* ── page entrance ── */
.sc{animation:ffFade .35s ease both}
.sc>*{animation:ffRise .6s var(--ease) both}
.sc>*:nth-child(2){animation-delay:.05s}.sc>*:nth-child(3){animation-delay:.1s}.sc>*:nth-child(4){animation-delay:.15s}
.sc>*:nth-child(5){animation-delay:.2s}.sc>*:nth-child(6){animation-delay:.25s}.sc>*:nth-child(n+7){animation-delay:.3s}
.sgr>*{animation:ffRise .6s var(--ease) both}
.sgr>*:nth-child(2){animation-delay:.07s}.sgr>*:nth-child(3){animation-delay:.14s}.sgr>*:nth-child(4){animation-delay:.21s}
.tr{animation:ffRise .5s var(--ease) both}
.tr:nth-child(2){animation-delay:.04s}.tr:nth-child(3){animation-delay:.08s}.tr:nth-child(4){animation-delay:.12s}.tr:nth-child(5){animation-delay:.16s}.tr:nth-child(n+6){animation-delay:.2s}

/* ── headings ── */
.st{font-family:var(--fd);letter-spacing:-.4px}
.ss{color:var(--t3)}
.ff-hello{font-family:var(--fd)!important;letter-spacing:-1px!important}
.ff-name{background:linear-gradient(120deg,var(--gold3),#9c7322,var(--gold3));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:ffGrad 8s ease-in-out infinite}
body.dark .ff-name{background-image:linear-gradient(120deg,var(--gold2),var(--gold),#fff3cf,var(--gold2));background-size:300% 100%}
.ff-wave{display:inline-block;transform-origin:70% 75%;animation:ffWave 2.6s ease-in-out 1s 2}
.sv,.num{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ── cards (reference: gradient card2→card, 1px line, 18px radius) ── */
.cd,.scd,.pc,.ttc,.mod,.lc{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--sh1)}
.scd{padding:16px 18px}
.scd>div[style*="bottom: 0"]{top:0!important;bottom:auto!important;height:2px!important}
.scd:hover,.pc:hover,.ttc:hover{transform:translateY(-3px);border-color:var(--or-bdr);box-shadow:var(--sh2)}
.sl{color:var(--t2);font-size:12px;letter-spacing:.02em;text-transform:none;font-weight:600}
.sv{font-size:30px;margin-top:10px}
.tr{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;box-shadow:none}
body.dark .tr{background:rgba(10,18,34,.6)}
.tr:hover{transform:translateY(-2px);border-color:var(--or-bdr)!important;box-shadow:0 12px 28px -14px rgba(216,178,90,.55)}
.tr.sel,body.dark .tr.sel{border-color:var(--gold)!important;background:var(--gold-soft)!important}
.alr{border-radius:16px;padding:13px 16px;border-width:1px!important;backdrop-filter:blur(6px)}
body.dark .alr:not(.alov):not(.altd){background:linear-gradient(90deg,rgba(124,92,230,.20),rgba(14,24,48,.55))!important;border-color:rgba(167,139,250,.35)!important;color:#e9e3ff!important}
body.dark .alr:not(.alov):not(.altd) strong{color:#fff}
.utb th{text-transform:none;letter-spacing:.02em;font-size:11.5px}

/* ── buttons ── */
.bn{border-radius:11px}
.bpr,body.dark .bn.bpr{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a1d00;font-weight:700;box-shadow:0 8px 22px -8px rgba(216,178,90,.7);position:relative;overflow:hidden}
.bpr:hover,body.dark .bn.bpr:hover{background:linear-gradient(135deg,#fae6ae,#e0b14a);transform:translateY(-2px);box-shadow:0 14px 30px -10px rgba(216,178,90,.85)}
.bpr::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);pointer-events:none}
.bpr:hover::after{animation:ffShine .8s ease}
.bse{background:var(--bg2);border:1px solid var(--bdr)}
.bn:active{transform:scale(.98)}

/* ── progress ── */
.prb{height:6px;border-radius:99px;background:var(--bg2)}
.prf{position:relative;overflow:hidden;border-radius:99px;background:linear-gradient(90deg,var(--acc),#8fb8ff)}
.prf::after{content:"";position:absolute;inset:0;width:45%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:ffShimmer 2.4s ease-in-out infinite}

/* ── inputs ── */
.ip,.fs{border-radius:12px;border-width:1px;background:var(--bg2)}
.ip:focus,body.dark .ip:focus,.fs:focus,body.dark .fs:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
body.dark .ip,body.dark .fs{background:var(--bg2)}
.fb{background:transparent;border-bottom:1px solid var(--line2)}

/* ── panels & modals ── */
.pbk{background:rgba(4,8,16,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:ffFade .25s ease both}
.pan{background:linear-gradient(180deg,var(--card2),var(--card));border-left:1px solid var(--bdr);box-shadow:-20px 0 60px rgba(4,8,16,.4);animation:slideIn .35s var(--ease) both}
.psb{background:var(--bg2)}
.mov{background:rgba(4,8,16,.55);animation:ffFade .2s ease both}
.mod{border-radius:22px;animation:ffPop .35s var(--ease) both}
.pt.at,body.dark .pt.at{border-color:var(--gold);color:var(--t1)}
.pco{color:var(--gold3);background:var(--gold-soft);border-color:var(--or-bdr)}
body.dark .pco{color:var(--gold2)}

/* ── login ── */
.lbg{position:relative;background:transparent}
.lc{position:relative;z-index:1;border-radius:26px;animation:ffPop .7s var(--ease) both;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 24px 60px rgba(0,0,0,.35)}
.lc::before{content:"";position:absolute;inset:0 0 auto;height:3px;border-radius:26px 26px 0 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.liw img{border-radius:18px;padding:8px;background:#fff;box-shadow:0 0 0 1px rgba(216,178,90,.4),0 12px 40px -8px rgba(216,178,90,.5)}
.lti{font-family:var(--fd)}

/* ── scrollbars ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#c3cbdb;border-radius:4px}

.pgr-gap{color:var(--t3);padding:0 4px}

/* ── Tasks: filters toggle ── */

.tk-fb{animation:ffDrop .2s var(--ease) both}
.tk-head{background:transparent!important;box-shadow:none!important}

  .pgn{flex-direction:column;align-items:stretch}

  .ffh-row{gap:8px;padding:8px 12px}
  .ffh-brand span{display:none}
  .ffh-mark{width:36px;height:36px;border-radius:11px}.ffh-mark img{width:28px;height:28px}
  .ffh-brand b{font-size:15px}

  .st{font-size:21px}

/* Biometric unlock */
.bio-box{display:flex;flex-direction:column;gap:10px}

.bio-btn:disabled{opacity:.6}

.bio-ic{font-size:30px;line-height:1}
.bio-alt{background:none;border:none;color:var(--t3);cursor:pointer;font-size:13px;font-family:var(--fb);padding:6px}
/* ═══ WORKER3 styles: recurring, checklist, performance ═══ */
.w3-chk{margin-top:18px;border:1px solid var(--bdr);border-radius:12px;padding:14px 16px;background:var(--bg)}
.w3-chk-h{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--t1)}
.w3-chk-h span{font-size:12px;color:var(--t3);font-weight:600}
.w3-chk-i{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px dashed var(--bdr);font-size:13px;color:var(--t2);cursor:pointer}
.w3-chk-i:last-of-type{border-bottom:none}
.w3-chk-i input{margin-top:2px;width:16px;height:16px;accent-color:var(--or);flex-shrink:0}
.w3-chk-i span{flex:1;line-height:1.45}
.w3-chk-i.dn span{text-decoration:line-through;color:var(--t3)}
.w3-chk-i button{background:none;border:none;color:var(--t3);font-size:16px;cursor:pointer;padding:0 4px;line-height:1}
.w3-rec-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.w3-rec{padding:18px}
.w3-rec.off{opacity:.6}
.w3-rec-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--t3)}
.w3-sw{position:relative;width:40px;height:22px;flex-shrink:0;cursor:pointer}
.w3-sw input{opacity:0;width:0;height:0;position:absolute}
.w3-sw i{position:absolute;inset:0;border-radius:999px;background:var(--bdr);transition:background .2s}
.w3-sw i:after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.w3-sw input:checked+i{background:var(--or)}
.w3-sw input:checked+i:after{transform:translateX(18px)}
.w3-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.w3-kpis{grid-template-columns:repeat(5,1fr)}
.w3-h{font-family:var(--fd);font-size:15px;font-weight:800;margin-bottom:14px;color:var(--t1)}

.w3-bar .col i{display:block;width:100%;background:var(--or);border-radius:4px 4px 0 0;opacity:.85;transition:opacity .15s}
.w3-bar.on .col i{opacity:1;box-shadow:0 0 0 2px var(--or-bdr,#f5a62355)}
.w3-bar .v{font-size:12px;font-weight:700;color:var(--t1);min-height:15px}
.w3-bar .l{font-size:11px;color:var(--t3);white-space:nowrap}

.w3-mini span{font-size:12.5px;font-weight:700;color:var(--t1)}
.w3-2c{align-items:start}
.w3-pbi{margin-top:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
@media(max-width:900px){.w3-kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:768px){.w3-kpis{grid-template-columns:1fr 1fr}.w3-rec-list{grid-template-columns:1fr}.w3-filters select{flex:1 1 140px;min-width:0!important}.w3-bars{height:150px;gap:6px}}
</style>

<script type="text/x-ff-jsx" id="ff-app-src">
const {useState,useEffect,useRef,createContext,useContext}=React;

// ─── FIREBASE CONFIG ─────────────────────────────────────────────────────────
const firebaseConfig={
  apiKey:"AIzaSyAnYFqrcUYd9fE_ue1FyBZix8OiW8dUegA",
  authDomain:"ncs-tasks.firebaseapp.com",
  databaseURL:"https://ncs-tasks-default-rtdb.firebaseio.com",
  projectId:"ncs-tasks",

firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const auth=firebase.auth();

// Auth helpers
const authSignIn=(email,pw)=>auth.signInWithEmailAndPassword(email,pw);
const authSignUp=(email,pw)=>auth.createUserWithEmailAndPassword(email,pw);
const authSignOut=()=>auth.signOut();
// ── Biometric unlock (Face ID / fingerprint via WebAuthn passkey) ──
// Works as a device "app lock": the real sign-in is still the Firebase Auth session
// (created by a password login). The passkey only gates re-opening that session on THIS device.
const BIO_KEY='ncsflow_bio';
const bioSupported=()=>!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext);
const bioPlatformAvail=async()=>{try{return bioSupported()&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();}catch{return false;}};
const bioGet=()=>{try{const v=JSON.parse(localStorage.getItem(BIO_KEY)||'null');return v&&v.credId&&v.uid?v:null;}catch{return null;}};
const bioClear=()=>{try{localStorage.removeItem(BIO_KEY);}catch{}};
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64=str=>{str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';return Uint8Array.from(atob(str),c=>c.charCodeAt(0));};
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const bioEnable=async(user)=>{
  if(!await bioPlatformAvail())throw new Error('This device does not support Face ID / fingerprint in the browser.');
  const cred=await navigator.credentials.create({publicKey:{
    challenge:rnd(32),rp:{name:'NCS Management',id:location.hostname},
    user:{id:new TextEncoder().encode(String(user.id)).slice(0,64),name:user.email||user.username,displayName:user.fullName},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
    timeout:60000,attestation:'none'}});
  const v={uid:user.id,email:(user.email||'').toLowerCase(),name:user.fullName,credId:b64u(cred.rawId),at:new Date().toISOString()};
  localStorage.setItem(BIO_KEY,JSON.stringify(v));return v;
};
const bioVerify=async()=>{
  const v=bioGet();if(!v)throw new Error('Biometric unlock is not set up on this device.');
  const a=await navigator.credentials.get({publicKey:{challenge:rnd(32),rpId:location.hostname,
    allowCredentials:[{type:'public-key',id:ub64(v.credId),transports:['internal','hybrid']}],
    userVerification:'required',timeout:60000}});
  if(!a||b64u(a.rawId)!==v.credId)throw new Error('Verification failed.');
  const flags=new Uint8Array(a.response.authenticatorData)[32];
  if(!(flags&0x04))throw new Error('Face ID / fingerprint was not confirmed.');
  return v;
};
const authReady=()=>new Promise(res=>{const un=auth.onAuthStateChanged(u=>{un();res(u);});});
const authUpdatePw=(newPw)=>auth.currentUser?auth.currentUser.updatePassword(newPw):Promise.reject('Not logged in');
const authReauth=(email,pw)=>auth.currentUser.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(email,pw));
const authResetEmail=email=>ffPreviewBlock()?ffPreviewErr():auth.sendPasswordResetEmail(email,{url:location.origin+location.pathname});
// A second Firebase app so an admin can create login accounts without being signed out.
let _auth2=null;
const auth2=()=>{if(!_auth2){const a=firebase.apps.find(x=>x.name==='ncs-admin2')||firebase.initializeApp(firebaseConfig,'ncs-admin2');_auth2=a.auth();}return _auth2;};
const strongPw=()=>Array.from(crypto.getRandomValues(new Uint8Array(18)),b=>'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#%'[b%61]).join('');
// Create (or confirm) the Firebase Auth account for a user. Returns 'created' | 'exists'.
const authPwWorks=async(email,pw)=>{const a=auth2();try{await a.signInWithEmailAndPassword(email,pw);await a.signOut();return true;}catch(e){return false;}};
const ensureAuthAccount=async(email,pw)=>{
  if(ffPreviewBlock())throw new Error('Preview is read-only (Show as).');
  const a=auth2();
  try{await a.createUserWithEmailAndPassword(email,pw&&pw.length>=6?pw:strongPw());await a.signOut();return 'created';}
  catch(e){if(e&&e.code==='auth/email-already-in-use')return 'exists';throw e;}
};

// DB helpers
const dbGet=path=>db.ref(path).once('value').then(s=>s.val());
// [SHOWAS] While the owner previews the app as someone else, the app is read-only.
const FF_PREVIEW={on:false};
const ffPreviewBlock=()=>{if(!FF_PREVIEW.on)return false;try{ffToast('👁 Preview is read-only. Exit "Show as" to make changes.');}catch(e){}return true;};
const ffPreviewErr=()=>Promise.reject(new Error('Preview is read-only (Show as). Nothing was saved.'));
const dbSet=(path,val)=>ffPreviewBlock()?ffPreviewErr():db.ref(path).set(val);
const dbOn=(path,cb,onErr)=>{const ref=db.ref(path);ref.on('value',s=>cb(s.val()),e=>{console.warn('DB read blocked:',path,e&&e.code);onErr&&onErr(e);});return()=>ref.off();};
// Login lookup: username / full name → email. Public, but only by exact key (cannot be listed).
const loginKey=s=>String(s||'').toLowerCase().trim().replace(/[.#$\[\]\/]/g,'_').slice(0,120);
const toArrV=v=>!v?[]:Array.isArray(v)?v.filter(Boolean):Object.values(v).filter(Boolean);
// [W1] Database-rules access list: ncsflow/access/{emailKey} = {role,active,userId,depts}. Same key the rules build from auth.token.email.
const emailKey=e=>{const k=String(e||'').toLowerCase().trim().replace(/\./g,',');return k&&!/[#$\[\]\/]/.test(k)?k:'';};
// [W1] Backup: download the whole ncsflow node as JSON (Global Admin). Same format as the daily Drive backup, so it can be
// re-imported at /ncsflow in the Firebase console. Old stored passwords are never included.
const stripSecrets=o=>{if(Array.isArray(o))return o.map(stripSecrets);if(o&&typeof o==='object'){const r={};Object.keys(o).forEach(k=>{if(k!=='password'&&k!=='tempPassword')r[k]=stripSecrets(o[k]);});return r;}return o;};
const downloadBackup=async()=>{
  const data=await dbGet('ncsflow');
  const blob=new Blob([JSON.stringify(stripSecrets(data)||{},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='NCS_Management_backup_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
};
// [W1] A signed-in user may clear ONLY their own "must change password" flag / old stored password
// (the locked rules allow this one field on their own record; the full Users list stays Global-Admin-only).
const selfClear=async(email,fields)=>{
  try{const em=String(email||'').toLowerCase().trim();const raw=await dbGet('ncsflow/users');if(!raw||!em)return;
    const ent=Object.entries(raw).find(([k,u])=>u&&String(u.email||'').toLowerCase().trim()===em);if(!ent)return;
    for(const f of fields){if(ent[1][f]!==undefined)await dbSet('ncsflow/users/'+ent[0]+'/'+f,null);}
  }catch(e){console.warn('selfClear',e&&e.code);}
};

// ─── EMAIL NOTIFICATIONS (Google Apps Script → Gmail) ────────────────────────
// Settings live in ncsflow/settings/email (Admin → Email Setup, Global Admin only).
// The page only sends IDs + short text. The Apps Script itself decides the recipients
// from ncsflow/users + the per-user rules (Email Setup screen), so the page cannot email arbitrary people.
// No passwords or API keys are stored in this file.
const EMAIL_CFG_PATH='ncsflow/settings/email';
// [W2 push] Push settings (public VAPID key only) live in ncsflow/settings/push. The same Apps Script
// sends the push through Firebase Cloud Messaging; its service-account key stays in Script properties.
const PUSH_CFG_PATH='ncsflow/settings/push';
// [SEC2] Only this account can open Email Setup (also enforced by the database rules on settings/email).
// Both must match: the Firebase login email (proven by its password) AND the user's full name.
const EMAIL_OWNER='bmedhat@next-cs.net';
const EMAIL_OWNER_NAME='bassem medhat';
// "Show additional data" flag on a user (set only by the owner) = that Global Admin can see Email Setup.
const canEmailSetup=u=>!!u&&u.role==='global_admin'&&u.showAdditional===true&&isEmailOwner(u);
const isEmailOwner=(u)=>{const e=(auth.currentUser&&auth.currentUser.email||'').toLowerCase().trim();
  const n=String(u&&u.fullName||'').toLowerCase().replace(/\s+/g,' ').trim();
  return !!e&&e===EMAIL_OWNER&&String(u&&u.email||'').toLowerCase().trim()===EMAIL_OWNER&&n===EMAIL_OWNER_NAME&&u.role==='global_admin';};
// [SEC2] Calls to the Apps Script carry the signed-in user's Firebase ID token instead of a shared key.
// The script checks the token with Firebase itself, so nobody can call it as someone else.
const ffSignedBody=async(obj)=>{const u=auth.currentUser;const idToken=u?await u.getIdToken():'';
  return JSON.stringify({...obj,idToken,email:u?(u.email||''):'',appUrl:location.origin+location.pathname,sentAt:new Date().toISOString()});};
const ffPost=(url,obj)=>ffPreviewBlock()?ffPreviewErr():ffSignedBody(obj).then(body=>fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body}));
// [CAL] Meeting invite: the Apps Script re-reads the meeting from Firebase and emails each attendee
// a calendar file (.ics, with the meeting link and a 15-minute reminder). Only IDs are sent from here.
const sendMeetingInvite=(m,kind)=>{
  if(!m||!m.id)return;
  dbGet(EMAIL_CFG_PATH).then(cfg=>{
    if(!cfg||!cfg.scriptUrl)return;
    ffPost(cfg.scriptUrl,{event:'meeting_invite',meetingId:m.id,kind:kind==='cancel'?'cancel':'request',stamp:(kind==='cancel'?m.canceledAt:m.updatedAt)||''}).catch(()=>{});
  }).catch(()=>{});
};
const safeLink=u=>{u=String(u||'').trim();return /^https:\/\/[^\s"'<>]+$/i.test(u)?u:'';};
const sendEmailNotif=(payload)=>{
  Promise.all([dbGet(EMAIL_CFG_PATH),dbGet(PUSH_CFG_PATH).catch(()=>null)]).then(([cfg,pcfg])=>{
    if(!cfg||!cfg.scriptUrl)return;
    const hasMention=(payload.mentions||[]).length>0;
    const pushOn=!!(pcfg&&pcfg.enabled)&&(payload.event==='assign'||hasMention);
    let mailOn=!!cfg.enabled&&payload.event!=='assign';

const playSound=(type)=>{
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    if(type==='notify'){
      o.frequency.setValueAtTime(520,ctx.currentTime);
      o.frequency.setValueAtTime(660,ctx.currentTime+0.1);
      g.gain.setValueAtTime(0.3,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.4);
      o.start(ctx.currentTime);o.stop(ctx.currentTime+0.4);
    } else if(type==='mention'){
      o.frequency.setValueAtTime(660,ctx.currentTime);
      o.frequency.setValueAtTime(880,ctx.currentTime+0.08);
      o.frequency.setValueAtTime(1100,ctx.currentTime+0.16);
      g.gain.setValueAtTime(0.3,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);
      o.start(ctx.currentTime);o.stop(ctx.currentTime+0.5);
    } else if(type==='complete'){
      [440,554,659].forEach((f,i)=>{
        const o2=ctx.createOscillator();const g2=ctx.createGain();
        o2.connect(g2);g2.connect(ctx.destination);
        o2.frequency.value=f;
        g2.gain.setValueAtTime(0.2,ctx.currentTime+i*0.12);
        g2.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.12+0.3);
        o2.start(ctx.currentTime+i*0.12);o2.stop(ctx.currentTime+i*0.12+0.3);
      });
    }
  }catch(e){}
};

  if(!project)return mkPhases();
  if(project.deptPhases&&deptId&&project.deptPhases[deptId])return ensureArr(project.deptPhases[deptId]);

// Get overall phases (for display when no dept selected) - merge all dept phases, take max progress
const getOverallPhases=(project)=>{
  if(!project.deptPhases)return mkPhases();
  const allDepts=Object.keys(project.deptPhases);
  if(allDepts.length===0)return mkPhases();
  if(allDepts.length===1)return ensureArr(project.deptPhases[allDepts[0]]);
  // Merge: for each phase, take the most advanced status across all depts
  const STATUS_ORDER={done:3,in_progress:2,pending:1};
  return mkPhases().map(basePh=>{
    let best=basePh;
    allDepts.forEach(d=>{
      const ph=ensureArr(project.deptPhases[d]).find(p=>p.phaseId===basePh.phaseId);
      if(ph&&(STATUS_ORDER[ph.status]||0)>(STATUS_ORDER[best.status]||0))best=ph;
    });
    return best;
  });
};

// Helper: get completion % for a main phase from project phases
const getMainPhaseStatus=(projectPhases,mainPhase)=>{

  if(!relevant.length)return{pct:0,status:'pending'};
  const done=relevant.filter(ph=>ph.status==='done').length;
  const pct=Math.round(done/relevant.length*100);
  const hasWip=relevant.some(ph=>ph.status==='in_progress');
  const status=done===relevant.length?'done':hasWip||done>0?'in_progress':'pending';
  return{pct,status,done,total:relevant.length};
};

// @mention autocomplete textarea
const MentionTextarea=({value,onChange,users,placeholder,onFocus})=>{
  const [suggestions,setSuggestions]=useState([]);
  const [mentionStart,setMentionStart]=useState(-1);
  const taRef=useRef(null);

  const handleChange=e=>{
    const v=e.target.value;
    const pos=e.target.selectionStart;
    onChange(v);
    // Find @ before cursor
    const beforeCursor=v.slice(0,pos);
    const atIdx=beforeCursor.lastIndexOf('@');
    if(atIdx>=0&&(atIdx===0||/\s/.test(beforeCursor[atIdx-1]))){
      const query=beforeCursor.slice(atIdx+1).toLowerCase();
      if(query.length>=0&&!query.includes(' ')){
        // [SEC2] Everyone can mention anyone (managers listed first); before only the first 5 users showed,
        // so people further down the list (e.g. the Global Admin) could not be picked unless pre-filled.
        const rank=u=>u.role==='global_admin'?0:u.role==='admin'?1:u.role==='co_admin'?2:3;
        const matches=users.filter(u=>u&&u.isActive&&(
          String(u.fullName||'').toLowerCase().includes(query)||
          String(u.username||'').toLowerCase().includes(query)
        )).sort((x,y)=>rank(x)-rank(y)||String(x.fullName||'').localeCompare(String(y.fullName||''))).slice(0,12);
        setSuggestions(matches);
        setMentionStart(atIdx);
        return;
      }
    }
    setSuggestions([]);setMentionStart(-1);
  };

  const selectUser=u=>{
    const before=value.slice(0,mentionStart);
    const after=value.slice(taRef.current.selectionStart);
    const newVal=before+'@'+u.fullName+' '+after;
    onChange(newVal);
    setSuggestions([]);setMentionStart(-1);
    setTimeout(()=>{if(taRef.current){const pos=before.length+u.fullName.length+2;taRef.current.setSelectionRange(pos,pos);taRef.current.focus();}},10);
  };

  return React.createElement('div',{style:{position:'relative',flex:1}},
    React.createElement('textarea',{
      ref:taRef,
      className:'ip',rows:3,
      placeholder,value,
      onChange:handleChange,
      onFocus:onFocus,
      onKeyDown:e=>{if(e.key==='Escape'){setSuggestions([]);setMentionStart(-1);}}
    }),
    suggestions.length>0&&React.createElement('div',{style:{
      position:'absolute',bottom:'100%',left:0,right:0,
      background:'var(--surf)',border:'1.5px solid var(--bdr)',
      borderRadius:10,boxShadow:'0 4px 16px #00000018',
      zIndex:500,overflow:'hidden',marginBottom:4
    }},
      React.createElement('div',{style:{padding:'6px 10px',fontSize:10.5,fontWeight:700,color:'var(--t3)',textTransform:'uppercase',borderBottom:'1px solid var(--bdr)'}},
        '👥 Mention someone'
      ),
      suggestions.map(u=>React.createElement('div',{
        key:u.id,
        onMouseDown:e=>{e.preventDefault();selectUser(u);},
        style:{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',cursor:'pointer',transition:'background .1s'},
        onMouseEnter:e=>{e.currentTarget.style.background='var(--bg)'},
        onMouseLeave:e=>{e.currentTarget.style.background='transparent'}
      },
        React.createElement(Av,{user:u,sz:'s'}),
        React.createElement('div',null,
          React.createElement('div',{style:{fontSize:13,fontWeight:600}},u.fullName),
          React.createElement('div',{style:{fontSize:11,color:'var(--t3)'}},u.email)
        ),
        React.createElement('span',{style:{marginLeft:'auto',fontSize:10.5,color:'var(--t3)',fontFamily:'var(--fm)'}},ROLE[u.role]?.l||u.role)
      ))
    )
  );
};

// Helper: highlight @mentions in comment text
const highlightMentions=(text,users)=>{
  if(!text||!text.includes('@'))return text;
  const parts=text.split(/(@\S+(?:\s\S+)?)/g);
  return parts.map((part,i)=>{
    if(part.startsWith('@')){
      const name=part.slice(1).toLowerCase();
      const found=users.find(u=>u.fullName.toLowerCase().startsWith(name)||u.username.toLowerCase()===name);
      if(found)return React.createElement('span',{key:i,style:{background:'#f0f9ff',color:'#0369a1',fontWeight:700,borderRadius:4,padding:'0 3px'}},part);
    }
    return part;
  });
};

const TaskTimeTab=({task,user,upd})=>{
  const [hours,setHours]=useState('');
  const [minutes,setMinutes]=useState('');
  const [note,setNote]=useState('');
  const [logDay,setLogDay]=useState(()=>localDay()); // [LOGIC] can log up to 7 days back (Bassem 2026-11-07)
  const minLogDay=(()=>{const d=new Date();d.setDate(d.getDate()-7);return localDay(d);})();
  const [editId,setEditId]=useState(null);
  const [editH,setEditH]=useState('');
  const [editM,setEditM]=useState('');
  const timeLog=task.timeLog||[];
  const isReviewed=!!task.supervisorReview; // lock if reviewed

  const totalMins=timeLog.reduce((s,e)=>s+(e.hours*60)+(e.minutes||0),0);
  const totalH=Math.floor(totalMins/60);
  const totalM=totalMins%60;

  const addEntry=()=>{
    if(isReviewed)return;
    const h=parseInt(hours)||0;
    const m=parseInt(minutes)||0;
    if(h===0&&m===0)return;
    const entry={
      id:uid(),
      date:(logDay>=minLogDay&&logDay<=localDay())?logDay:localDay(),
      hours:h,
      minutes:m,
      note:note.trim(),
      loggedBy:user.id,
      createdAt:new Date().toISOString()
    };
    upd({...task,timeLog:[...timeLog,entry]});
    setHours('');setMinutes('');setNote('');setLogDay(localDay());
  };

  // [LOGIC] only the person who logged the time (or Global Admin / Admin) can change it, and every change goes to History
  const {users:ttUsers}=useCtx();
  const canTouch=e=>(e.loggedBy||task.assignedTo)===user.id||user.role==='global_admin'||user.role==='admin';
  const ttName=e=>{const u=(ttUsers||[]).find(x=>x.id===(e.loggedBy||task.assignedTo));return u?u.fullName.split(' ')[0]:'';};
  const ttLog=(e,nv)=>({id:uid(),performedBy:user.id,action:'time_changed',fieldChanged:'timeLog',oldValue:e.date+' '+e.hours+'h '+(e.minutes||0)+'m ('+ttName(e)+')',newValue:nv,performedAt:T()});
  const deleteEntry=(id)=>{const e=timeLog.find(x=>x.id===id);if(isReviewed||!e||!canTouch(e))return;
    upd({...task,timeLog:timeLog.filter(x=>x.id!==id),auditLog:[...(task.auditLog||[]),ttLog(e,'deleted')]});};

  const saveEdit=(id)=>{
    const e=timeLog.find(x=>x.id===id);if(isReviewed||!e||!canTouch(e))return;
    const h=Math.min(24,Math.max(0,parseInt(editH)||0)),m=Math.min(59,Math.max(0,parseInt(editM)||0));
    upd({...task,timeLog:timeLog.map(x=>x.id===id?{...x,hours:h,minutes:m}:x),auditLog:[...(task.auditLog||[]),ttLog(e,h+'h '+m+'m')]});
    setEditId(null);

  return React.createElement('div',null,

          totalH>0?totalH+'h ':'',(totalM>0||totalH===0)?totalM+'m':'',
          React.createElement('span',{style:{fontSize:12,fontWeight:500,color:'#166534',marginLeft:8}},timeLog.length+' session'+(timeLog.length!==1?'s':''))
        )
      ),
      React.createElement('div',{style:{fontSize:36}},'⏱️')
    ),

    // Reviewed lock notice
    isReviewed&&React.createElement('div',{style:{display:'flex',alignItems:'center',gap:8,padding:'10px 14px',background:'#f0fdf4',border:'1.5px solid #bbf7d0',borderRadius:10,marginBottom:16,fontSize:12.5,fontWeight:600,color:'#059669'}},

const PwResetScreen=({users,setUsers})=>{
  const [requests,setRequests]=useState([]);
  const [processed,setProcessed]=useState({});
  const [dismissed,setDismissed]=useState({});

  useEffect(()=>{
    const unsub=dbOn('ncsflow/pwResets',v=>{
      if(!v)return setRequests([]);
      const arr=Array.isArray(v)?v:Object.values(v);
      const now=new Date();
      // Auto-delete requests older than 1 hour
      arr.forEach(r=>{
        if(r&&r.requestedAt){
          const age=(now-new Date(r.requestedAt))/60000; // minutes
          if(age>60)dbSet('ncsflow/pwResets/'+r.id,null);
        }
      });
      // Show pending + done (so admin can see temp password)
      setRequests(arr.filter(r=>r&&(r.status==='pending'||r.status==='done')&&((new Date()-new Date(r.requestedAt))/60000)<=60).sort((a,b)=>new Date(b.requestedAt)-new Date(a.requestedAt)));
    });
    return unsub;
  },[]);

  const genTemp=()=>'NCS@'+Math.random().toString(36).slice(2,6).toUpperCase();

  const resetPw=async(req)=>{
    try{const em=(req.userEmail||'').toLowerCase().trim();await ensureAuthAccount(em,null);await authResetEmail(em);}catch(e){alert('Could not send reset email: '+(e&&e.message||e));return;}
    dbSet('ncsflow/pwResets/'+req.id,{...req,status:'done',resetAt:new Date().toISOString(),tempPassword:null});
    setProcessed(prev=>({...prev,[req.id]:'Reset link emailed to '+req.userEmail}));
  };

  const dismiss=(reqId)=>{
    setDismissed(prev=>({...prev,[reqId]:true}));
    dbSet('ncsflow/pwResets/'+reqId,null);
  };

  const visible=requests.filter(r=>!dismissed[r.id]);

    return React.createElement('div',{className:'sc fi'},

        React.createElement('div',{style:{fontSize:13,color:'var(--t3)',marginTop:6}},'No password reset requests at this time.')

  return React.createElement('div',{className:'sc fi'},
    React.createElement('div',{className:'sh'},
      React.createElement('div',null,
        React.createElement('div',{className:'st'},'🔐 Password Reset Requests'),

      const done=processed[req.id]||(req.status==='done'?'Reset link emailed to '+req.userEmail:null);
      return React.createElement('div',{key:req.id,className:'cd',style:{padding:'20px 24px',marginBottom:14}},

          React.createElement('div',null,
            React.createElement('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:8}},
              React.createElement('div',{style:{width:40,height:40,borderRadius:'50%',background:'#f59e0b20',border:'2px solid #f59e0b40',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}},'🔐'),
              React.createElement('div',null,
                React.createElement('div',{style:{fontFamily:'var(--fd)',fontSize:15,fontWeight:700}},req.userName),
                React.createElement('div',{style:{fontSize:12.5,color:'var(--t3)'}},req.userEmail)

              'Requested: '+new Date(req.requestedAt).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})

  const [forgotLd,setForgotLd]=useState(false);
  const [bio,setBio]=useState(()=>bioGet());
  const bioLogin=async(auto)=>{
    if(auto!==true)auto=false; // onClick passes an event
    setErr('');setLd(true);
    try{
      const v=await bioVerify();
      const fbUser=auth.currentUser||await authReady();
      if(!fbUser||(fbUser.email||'').toLowerCase()!==v.email){
        setErr('Your session expired. Please sign in with your password once, then Face ID / fingerprint will work again.');setLd(false);return;}
      const list=(allUsers&&allUsers.length)?allUsers:USERS;
      if(!list.length){setErr('Still loading, please try again in a moment.');setLd(false);return;} // don't forget the fingerprint just because users aren't loaded yet
      const found=list.find(u=>u.id===v.uid&&u.isActive);
      if(!found){bioClear();setBio(null);authSignOut();setErr('User not found or inactive.');setLd(false);return;}
      onLogin(found);
    }catch(e){setErr(e&&e.name==='NotAllowedError'?(auto?'':'Cancelled.'):(e.message||'Biometric sign-in failed.'));setLd(false);}
  };
  const useOther=()=>{bioClear();setBio(null);authSignOut();};
  // Ask for the fingerprint / Face ID at once when the app opens (Bassem 2026-11-07).
  // Once per app open; if the phone refuses without a tap (e.g. iPhone), the button stays as before.
  const bioAutoRef=useRef(false);
  useEffect(()=>{
    if(!bio||bioAutoRef.current||!(allUsers&&allUsers.length)||document.visibilityState!=='visible')return;

    return()=>clearTimeout(t);
  },[bio,allUsers&&allUsers.length]);

  // Find the email for what the user typed (username, full name or email).
  const resolveEmail=async(raw)=>{
    const idLower=String(raw||'').toLowerCase().trim();
    const list=(allUsers&&allUsers.length)?allUsers:[];
    const found=list.find(u=>u&&u.isActive&&(
      (u.username||'').toLowerCase()===idLower||(u.email||'').toLowerCase()===idLower||(u.fullName||'').toLowerCase()===idLower));
    if(found)return {email:(found.email||'').toLowerCase(),found};
    if(idLower.includes('@'))return {email:idLower,found:null};
    try{const e=await dbGet('ncsflow/loginIndex/'+loginKey(idLower));if(e)return {email:String(e).toLowerCase(),found:null};}catch(_){}
    return {email:null,found:null};
  };
  const sub=async e=>{
    e.preventDefault();setLd(true);setErr('');

      const {email,found}=await resolveEmail(id);
      if(!email){setErr('User not found. Try signing in with your email address.');setLd(false);return;}
      try{
        await authSignIn(email,pw);
      }catch(fe){
        const c=fe&&fe.code;
        // One-time migration for old accounts that still have a stored password and no login account yet
        if(found&&found.password&&(c==='auth/user-not-found'||c==='auth/invalid-credential'||c==='auth/invalid-login-credentials')&&pw===found.password){
          try{await authSignUp(email,pw);}
          catch(e2){setErr(e2&&e2.code==='auth/email-already-in-use'?'Wrong password.':'Sign-in error: '+e2.message);setLd(false);return;}
        }else if(c==='auth/too-many-requests'){setErr('Too many attempts. Wait a few minutes or use "Forgot Password".');setLd(false);return;}
        else{setErr('Wrong username/email or password.');setLd(false);return;}
      }
      // Signed in → read the user record (allowed now even when database rules are locked)
      let rec=found;
      if(!rec){try{rec=toArrV(await dbGet('ncsflow/users')).find(u=>(u.email||'').toLowerCase()===email);}catch(_){rec=null;}}
      if(!rec||!rec.isActive){authSignOut();setErr('User not found or inactive.');setLd(false);return;}
      onLogin(rec);
    }catch(x){setErr('Login failed: '+(x&&x.message||x));setLd(false);}
  };

  const submitForgot=async()=>{

    try{await authResetEmail(email);}catch(e){
      if(!(e&&(e.code==='auth/user-not-found'||e.code==='auth/invalid-email'))){setForgotErr('Could not send the email. Try again.');setForgotLd(false);return;}

// Animated constellation background (inspired by the reference design)
(function ffStarfield(){
  if(window.__ffFx)return;window.__ffFx=1;
  const glow=document.createElement('div');glow.className='ff-glow';
  const c=document.createElement('canvas');c.id='ff-fx';
  document.body.prepend(c);document.body.prepend(glow);
  const ctx=c.getContext('2d');if(!ctx)return;
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,dpr=1,pts=[];
  const size=()=>{dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.min(90,Math.round(W*H/16000));pts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,r:Math.random()*1.4+.4,g:Math.random()<.18,p:Math.random()*6.28}));};
  const draw=t=>{
    ctx.clearRect(0,0,W,H);
    const dark=document.body.classList.contains('dark');
    for(let i=0;i<pts.length;i++){const a=pts[i];
      if(!reduce){a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>W)a.vx*=-1;if(a.y<0||a.y>H)a.vy*=-1;}
      for(let j=i+1;j<pts.length;j++){const b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;
        if(d<15000){ctx.strokeStyle=(dark?'rgba(91,151,247,':'rgba(37,99,235,')+(0.16*(1-d/15000)).toFixed(3)+')';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}
      const tw=.55+.45*Math.sin((t||0)/900+a.p);
      ctx.fillStyle=a.g?'rgba(216,178,90,'+(.85*tw)+')':(dark?'rgba(170,200,255,':'rgba(37,99,235,')+(.7*tw)+')';
      ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,6.283);ctx.fill();}
  };
  let raf=0;const loop=t=>{draw(t);raf=requestAnimationFrame(loop);};
  size();window.addEventListener('resize',()=>{size();if(reduce)draw(0);});
  if(reduce){draw(0);}else{raf=requestAnimationFrame(loop);
    document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(raf);else raf=requestAnimationFrame(loop);});}
})();

const MeetingReviewScreen=({user,activeDept=''})=>{
  const {users}=useCtx();
  const [meetings,setMeetingsRaw]=useState([]);
  const [filter,setFilter]=useState('not_reviewed');
  const [filterUser,setFilterUser]=useState('');
  const [editingTime,setEditingTime]=useState(null);

  useEffect(()=>{
    const unsub=dbOn('ncsflow/meetings',v=>{
      if(!v)return setMeetingsRaw([]);
      setMeetingsRaw(Array.isArray(v)?v:Object.values(v));
    });
    return unsub;
  },[]);

  const saveMeetings=(m)=>{dbSet('ncsflow/meetings',sanitize(m));setMeetingsRaw(m);};

  // Flatten: one row per attendee — filtered by dept
  const rows=[];
  meetings.forEach(m=>{
    // dept filter — check departments array first, fallback to department field
    if(activeDept){
      const mDepts=m.departments&&m.departments.length>0?m.departments:(m.department?[m.department]:[]);
      if(mDepts.length>0&&!mDepts.includes(activeDept))return;
    }
    const attendance=m.attendance||{};
    Object.entries(attendance).forEach(([uid,att])=>{
      if(!att)return;
      const attendee=users.find(u=>u.id===uid);
      if(!attendee)return;
      if(filterUser&&uid!==filterUser)return;
      rows.push({meeting:m,uid,att,attendee});
    });
  });

  const filteredRows=rows.filter(r=>{
    const reviewed=!!r.att.reviewedByAdmin;
    if(filter==='not_reviewed')return !reviewed;
    if(filter==='reviewed')return reviewed;
    return true;
  }).sort((a,b)=>new Date(b.meeting.date)-new Date(a.meeting.date));

  const notRevCount=rows.filter(r=>!r.att.reviewedByAdmin).length;
  const revCount=rows.filter(r=>!!r.att.reviewedByAdmin).length;

  const deptInfo=DEPARTMENTS.find(d=>d.id===activeDept);

  const markReviewed=(m,uid)=>{
    const updated=meetings.map(x=>x.id===m.id?{

    saveMeetings(updated);

  const undoReview=(m,uid)=>{

// ALL EMPLOYEE HOURS SCREEN — Global Admin only, all departments collapsed
const AllEmployeeHoursScreen=({user})=>{
  const {users,tasks}=useCtx();

  const [filterMode,setFilterMode]=useState('week');
  const [weekOffset,setWeekOffset]=useState(0);
  const [monthOffset,setMonthOffset]=useState(0);
  const [expanded,setExpanded]=useState({}); // {deptId: bool}

  useEffect(()=>{
    const unsub=dbOn('ncsflow/meetings',v=>{
      if(!v)return setMeetingsRaw([]);
      setMeetingsRaw(Array.isArray(v)?v:Object.values(v));
    });
    return unsub;
  },[]);

  // ── Bounds ──
  const getBounds=()=>{
    if(filterMode==='week'){
      const now=new Date();
      const daysSinceFri=((now.getDay()-5)+7)%7;
      const fri=new Date(now);fri.setDate(now.getDate()-daysSinceFri+(weekOffset*7));fri.setHours(0,0,0,0);
      const thu=new Date(fri);thu.setDate(fri.getDate()+6);thu.setHours(23,59,59,999);
      return {start:fri,end:thu};
    } else {
      const now=new Date();const mo=now.getMonth()+monthOffset;const y=now.getFullYear();
      return {start:new Date(y,mo,1),end:new Date(y,mo+1,0,23,59,59,999)};
    }
  };
  const {start:bStart,end:bEnd}=getBounds();

  const inBounds=(dateStr)=>{
    if(!dateStr)return false;
    try{const s=dateStr.split('T')[0];const[y,mo,d]=s.split('-').map(Number);const dt=new Date(y,mo-1,d);return dt>=bStart&&dt<=bEnd;}

  const getMtgMins=(uid,deptId)=>{
    let mins=0;
    meetings.filter(m=>{
      if(m.status==='canceled'||!inBounds(m.date))return false;
      if(!(m.attendees||[]).includes(uid))return false;

  const getTaskMins=(uid,deptId)=>{

      (t.timeLog||[]).forEach(e=>{if(logOwner(e,t)===uid&&inBounds(e.date||e.loggedAt||e.createdAt))mins+=(e.hours||0)*60+(e.minutes||0);});
    });
    return mins;
  };

  const getMtgCount=(uid,deptId)=>meetings.filter(m=>{

// EMPLOYEE HOURS SCREEN — per department
const EmployeeHoursScreen=({user,activeDept=''})=>{
  const {users,tasks}=useCtx();
  const [meetings,setMeetingsRaw]=useState([]);
  const [filterMode,setFilterMode]=useState('week');
  const [weekOffset,setWeekOffset]=useState(0);
  const [monthOffset,setMonthOffset]=useState(0);

  useEffect(()=>{
    const unsub=dbOn('ncsflow/meetings',v=>{
      if(!v)return setMeetingsRaw([]);
      setMeetingsRaw(Array.isArray(v)?v:Object.values(v));
    });
    return unsub;
  },[]);

  // ── Bounds ──
  const getBounds=()=>{
    if(filterMode==='week'){
      const now=new Date();
      const daysSinceFri=((now.getDay()-5)+7)%7;
      const fri=new Date(now);fri.setDate(now.getDate()-daysSinceFri+(weekOffset*7));fri.setHours(0,0,0,0);
      const thu=new Date(fri);thu.setDate(fri.getDate()+6);thu.setHours(23,59,59,999);
      return {start:fri,end:thu};
    } else {
      const now=new Date();const mo=now.getMonth()+monthOffset;const y=now.getFullYear();
      return {start:new Date(y,mo,1),end:new Date(y,mo+1,0,23,59,59,999)};
    }
  };
  const {start:bStart,end:bEnd}=getBounds();

  const inBounds=(dateStr)=>{
    if(!dateStr)return false;
    try{const s=dateStr.split('T')[0];const[y,mo,d]=s.split('-').map(Number);const dt=new Date(y,mo-1,d);return dt>=bStart&&dt<=bEnd;}
    catch(e){return false;}
  };

  const fmtH=(mins)=>{if(!mins)return '0h';const h=Math.floor(mins/60);const m=mins%60;return h>0?(m>0?h+'h '+m+'m':h+'h'):(m+'m');};
  const fmtDate=(d)=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  const periodLabel=filterMode==='week'
    ?(weekOffset===0?'This Week':weekOffset===-1?'Last Week':Math.abs(weekOffset)+(weekOffset<0?' weeks ago':' weeks ahead'))
    :(monthOffset===0?'This Month':monthOffset===-1?'Last Month':Math.abs(monthOffset)+(monthOffset<0?' months ago':' months ahead'));

  // ── Active meetings in dept & range ──
  const activeMeetings=meetings.filter(m=>{
    if(m.status==='canceled')return false;
    if(!inBounds(m.date))return false;
    if(activeDept){
      const mDepts=m.departments&&m.departments.length>0?m.departments:(m.department?[m.department]:[]);
      if(mDepts.length>0&&!mDepts.includes(activeDept))return false;
    }
    return true;
  });

  // ── Dept employees ──
  const deptUsers=users.filter(u=>u.isActive&&(!activeDept||!u.departments||u.departments.length===0||u.departments.includes(activeDept)));

  // ── Per employee calcs ──
  const getEmpMtgMins=(uid)=>{
    let mins=0;
    activeMeetings.filter(m=>m.attendees&&m.attendees.includes(uid)).forEach(m=>{
      const att=(m.attendance||{})[uid];
      if(att){
        // Use actual logged time if available
        mins+=(att.actualHours||0)*60+(att.actualMinutes||0);
      } else if(mtgEnded(m)) {
        // Fall back to planned duration (only once the meeting is over)
        const [sh,sm]=(m.startTime||'00:00').split(':').map(Number);
        const [eh,em]=(m.endTime||'00:00').split(':').map(Number);
        mins+=Math.max(0,(eh*60+em)-(sh*60+sm));
      }
    });
    return mins;
  };

  const getEmpTaskMins=(uid)=>{
    let mins=0;
    tasks.filter(t=>{
      if(!workedOn(t,uid)||t.status==='deleted')return false;
      if(!activeDept)return true;
      // Check task.department first, then fall back to project departments
      if(t.department)return t.department===activeDept;
      return true; // include tasks without dept — they show everywhere
    }).forEach(t=>{
      (t.timeLog||[]).forEach(e=>{
        if(logOwner(e,t)===uid&&inBounds(e.date||e.loggedAt||e.createdAt))
          mins+=(e.hours||0)*60+(e.minutes||0);
      });
    });
    return mins;
  };

  const getEmpMtgCount=(uid)=>activeMeetings.filter(m=>m.attendees&&m.attendees.includes(uid)).length;
  const getEmpTaskCount=(uid)=>tasks.filter(t=>{
    if(t.assignedTo!==uid||t.status==='deleted')return false;
    if(!activeDept)return true;
    if(t.department)return t.department===activeDept;
    return true;
  }).length;

  // ── Export ──
  const exportExcel=()=>{
    const toH=(mins)=>mins>0?parseFloat((mins/60).toFixed(2)):0;
    const period=fmtDate(bStart)+' – '+fmtDate(bEnd);
    const rows=[['Employee','Role','Meetings','Meeting Hours','Tasks','Task Hours','Total Hours','Period']];
    deptUsers.forEach(u=>{
      const mtgMins=getEmpMtgMins(u.id);
      const tskMins=getEmpTaskMins(u.id);
      rows.push([u.fullName,u.role,getEmpMtgCount(u.id),toH(mtgMins),getEmpTaskCount(u.id),toH(tskMins),toH(mtgMins+tskMins),period]);
    });
    const csv=rows.map(r=>r.join(',')).join('\n');
    const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='Employee_Hours_'+periodLabel.replace(/ /g,'_')+'.csv';a.click();
  };

// PROJECT RESOURCE HOURS SCREEN
const ProjectCostScreen=({user,activeDept=''})=>{
  const {projects,users,tasks,taskTypes}=useCtx();
  const [meetings,setMeetingsRaw]=useState([]);
  const [filterMode,setFilterMode]=useState('week');
  const [weekOffset,setWeekOffset]=useState(0);
  const [monthOffset,setMonthOffset]=useState(0);

  useEffect(()=>{
    const unsub=dbOn('ncsflow/meetings',v=>{
      if(!v)return setMeetingsRaw([]);
      setMeetingsRaw(Array.isArray(v)?v:Object.values(v));
    });
    return unsub;
  },[]);

  // ── Bounds ──
  const getBounds=()=>{
    if(filterMode==='week'){
      const now=new Date();
      const daysSinceFri=((now.getDay()-5)+7)%7;
      const fri=new Date(now);fri.setDate(now.getDate()-daysSinceFri+(weekOffset*7));fri.setHours(0,0,0,0);
      const thu=new Date(fri);thu.setDate(fri.getDate()+6);thu.setHours(23,59,59,999);
      return {start:fri,end:thu};
    } else {
      const now=new Date();const mo=now.getMonth()+monthOffset;const y=now.getFullYear();
      return {start:new Date(y,mo,1),end:new Date(y,mo+1,0,23,59,59,999)};
    }
  };
  const {start:bStart,end:bEnd}=getBounds();

  const inBounds=(dateStr)=>{
    if(!dateStr)return false;
    try{const s=dateStr.split('T')[0];const[y,mo,d]=s.split('-').map(Number);const dt=new Date(y,mo-1,d);return dt>=bStart&&dt<=bEnd;}
    catch(e){return false;}
  };

  const activeMeetings=meetings.filter(m=>m.status!=='canceled'&&inBounds(m.date));

  const getMtgHours=(projectId,deptId)=>{
    let mins=0;
    activeMeetings.filter(m=>m.projectId===projectId&&(!m.department||m.department===deptId)).forEach(m=>{
      Object.values(m.attendance||{}).forEach(att=>{if(att)mins+=(att.actualHours||0)*60+(att.actualMinutes||0);});
    });
    return mins;
  };

  const getTaskHours=(projectId,deptId)=>{
    let mins=0;
    tasks.filter(t=>t.projectId===projectId&&t.status!=='deleted'&&(!t.department||t.department===deptId)).forEach(t=>{
      (t.timeLog||[]).forEach(e=>{if(inBounds(e.date||e.loggedAt||e.createdAt))mins+=(e.hours||0)*60+(e.minutes||0);});
    });
    return mins;
  };

  const fmtH=(mins)=>{if(!mins)return '0h';const h=Math.floor(mins/60);const m=mins%60;return h>0?(m>0?h+'h '+m+'m':h+'h'):(m+'m');};

    :(monthOffset===0?'This Month':monthOffset===-1?'Last Month':Math.abs(monthOffset)+(monthOffset<0?' months ago':' months ahead'));

  // ── Export to Excel ──
  const exportExcel=()=>{
    const toH=(mins)=>mins>0?parseFloat((mins/60).toFixed(2)):0;
    const rows=[['Project','Department','Meeting Hours','Task Hours','Total Hours','Period']];

      deptProjects.forEach(p=>{

      });
    });
